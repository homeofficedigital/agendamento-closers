.meses.has(r.idx)){\n      const projecao = r.diasDecorridos>0 ? (r.totalMes / r.diasDecorridos) * r.diasNoMes : 0;\n      const diffMeta = projecao - r.metaMes;\n      elProj.textContent = fmtMoeda(projecao);\n      elProjDet.textContent = `ritmo até o dia ${r.diasDecorridos} de ${r.diasNoMes} · ${diffMeta>=0 ? 'bateria a meta em '+fmtMoeda(diffMeta) : 'ficaria '+fmtMoeda(-diffMeta)+' abaixo da meta'}`;\n    } else if(r && r.status==='fechado' && st.meses.size===1 && st.meses.has(r.idx)){\n      elProj.textContent = fmtMoeda(r.totalMes);\n      elProjDet.textContent = 'mês encerrado · resultado final';\n    } else {\n      elProj.textContent = '—';\n      elProjDet.textContent = 'selecione um único mês para ver a projeção';\n    }\n  }\n  $('kLowTicketValor').textContent = fmtMoeda(lowTicket.valor);\n  $('kLowTicketValorDet').textContent = `já somado ao Total Vendido${filtroDiasTexto}`;\n  $('kLowTicketQtd').textContent = lowTicket.qtd;\n  $('kLowTicketQtdDet').textContent = lowTicket.qtd===1 ? 'venda no período' : 'vendas no período';\n  $('kRecDiegoValor').textContent = fmtMoeda(recDiego.valor);\n  $('kRecDiegoValorDet').textContent = `já somado ao Total Vendido${filtroDiasTexto}`;\n  $('kRecDiegoQtd').textContent = recDiego.qtd;\n  $('kRecDiegoQtdDet').textContent = recDiego.qtd===1 ? 'recuperação no período' : 'recuperações no período';\n  // Seção oculta a partir de outubro/26 (mês em foco), mas o valor continua somado ao Total Vendido acima\n  {\n    const idxFoco = mesFocoAtual();\n    const io = idxOutubro();\n    $('secRecDiego').style.display = (io>=0 && idxFoco>=io) ? 'none' : '';\n  }\n  // Evolução vs. mês anterior — compara o mês em foco com o mês imediatamente anterior.\n  // Se o mês em foco ainda está em andamento (mês corrente), a comparação usa o mesmo\n  // corte de dia nos dois meses (dia 1 até \"hoje\"), para ser uma comparação justa no meio do mês.\n  // Se o mês em foco já está fechado (passado por completo), compara o total INTEIRO de cada\n  // mês, mesmo que tenham quantidades de dias diferentes (ex.: Setembro=30 vs Agosto=31) —\n  // não faz sentido cortar Agosto no dia 30 só porque Setembro tem 30 dias.\n  {\n    const idxFoco = mesFocoAtual();\n    const idxAnterior = idxFoco - 1;\n    const diaCorteAtual = idxFoco>=0 ? diasElapsedNoMes(idxFoco) : 0;\n    const hoje = hojeInfo();\n    let mesEmAndamento = false;\n    if(idxFoco>=0 && hoje){\n      const {ano,mes} = parseMesLabel(DADOS.meses[idxFoco]);\n      mesEmAndamento = (ano===hoje.ano && mes===hoje.mes);\n    }\n    const diaCorteAnterior = idxAnterior<0 ? 0 : (mesEmAndamento ? diaCorteAtual : diasElapsedNoMes(idxAnterior));\n    const elEvo = $('kEvo'), elDet = $('kEvoDet'), elRot = $('kEvoRotulo');\n    elEvo.classList.remove('positivo','negativo');\n    if(idxFoco<0 || idxAnterior<0 || diaCorteAtual<=0){\n      elRot.textContent = 'Evolução vs. mês anterior';\n      elEvo.textContent = '—';\n      elDet.textContent = idxAnterior<0 ? 'sem mês anterior na base' : 'sem dias decorridos no mês em foco';\n    } else {\n      const totAtual = totalClosersAteDia(idxFoco, diaCorteAtual);\n      const totAnterior = totalClosersAteDia(idxAnterior, diaCorteAnterior);\n      elRot.textContent = mesEmAndamento\n        ? `Evolução vs. mês anterior (dias 1–${diaCorteAtual})`\n        : 'Evolução vs. mês anterior (mês completo)';\n      if(totAnterior > 0){\n        const variacao = (totAtual - totAnterior) / totAnterior * 100;\n        elEvo.textContent = (variacao>=0?'+':'') + variacao.toFixed(1) + '%';\n        elEvo.classList.add(variacao>=0 ? 'positivo' : 'negativo');\n      } else {\n        elEvo.textContent = totAtual>0 ? '+100%' : '—';\n        if(totAtual>0) elEvo.classList.add('positivo');\n      }\n      elDet.textContent = `${DADOS.meses[idxFoco]}: ${fmtMoeda(totAtual)} vs ${DADOS.meses[idxAnterior]}: ${fmtMoeda(totAnterior)}`;\n    }\n  }\n\n  const nDias = diasNoFiltro();\n  $('kMediaFiltro').textContent = nDias ? fmtMoeda(totGeral/nDias) + '/dia' : '—';\n  $('kMediaFiltroDet').textContent = nDias ? `${nDias} dia${nDias>1?'s':''} corrido${nDias>1?'s':''} no recorte atual` : 'sem dias no recorte atual';\n\n  slats($('gCloser'), rankCloser);\n  slats($('gSdr'), rankSdr);\n  buscaCloser.setTotal(rankCloser.length);\n  buscaSdr.setTotal(rankSdr.length);\n  buscaCloser.aplica();\n  buscaSdr.aplica();\n\n  // ── Reembolsos, respeitando o mesmo recorte de meses + dias ──\n  const rankReembCloser = rankingEquipe(DADOS.closers, DADOS.reembolsoCloser).filter(([,v])=>v>0);\n  const rankReembSdr = rankingEquipe(DADOS.sdrs, DADOS.reembolsoSDR).filter(([,v])=>v>0);\n  const totReembolsos = rankReembCloser.reduce((s,[,v])=>s+v,0);\n  const fmtContagem = v => `${v} pedido${v!==1?'s':''}`;\n  $('reembolsosSub').textContent = `${totReembolsos} pedido${totReembolsos!==1?'s':''} pago${totReembolsos!==1?'s':''} e cancelado${totReembolsos!==1?'s':''} em até 7 dias, no período selecionado — não entram no total vendido`;\n  slats($('gReembolsoCloser'), rankReembCloser, fmtContagem);\n  slats($('gReembolsoSdr'), rankReembSdr, fmtContagem);\n\n  // Alerta de divergência entre total de Closers e total de SDRs por mês\n  const divergentes = calcDivergencias();\n  const alerta = $('alertaDivergencia');\n  if(divergentes.length){\n    alerta.style.display = 'block';\n    alerta.innerHTML = '⚠️ <strong>Divergência entre Closers e SDRs detectada:<\/strong><br>' +\n      divergentes.map(d=>`${d.mes}: Closers ${fmtMoeda(d.totC)} × SDRs ${fmtMoeda(d.totS)} (diferença de ${fmtMoeda(Math.abs(d.diff))})`).join('<br>');\n  } else {\n    alerta.style.display = 'none';\n    alerta.innerHTML = '';\n  }\n\n  renderTimes();\n  renderSprinters();\n  renderRoas();\n  renderGhl();\n  renderIndividual();\n  renderRitmo();\n}\n\n// ── Renderiza os cartões de ritmo (dias restantes / necessário por dia / quanto ontem) ──\nfunction renderRitmo(){\n  const bloco = $('blocoRitmo');\n  const r = calcRitmo();\n  const rotuloDias = document.querySelector('#blocoRitmo .k-dias .rotulo');\n  const rotuloNecessario = document.querySelector('#blocoRitmo .k-necessario .rotulo');\n  const rotuloOntem = document.querySelector('#blocoRitmo .k-ontem .rotulo');\n\n  if(!r){\n    bloco.style.display = 'none';\n  } else if(r.status === 'futuro'){\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = '—';\n    $('kDiasDet').textContent = `${r.mesLabel} ainda não começou`;\n    rotuloNecessario.textContent = 'Necessário por dia';\n    $('kNecessario').textContent = '—';\n    $('kNecessarioDet').textContent = '';\n  } else if(r.status === 'fechado'){\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = 'Mês encerrado';\n    $('kDiasDet').textContent = `${r.mesLabel} já fechou (${r.diasNoMes} dias corridos)`;\n\n    rotuloNecessario.textContent = 'Resultado da meta';\n    if(r.faltaMes > 0.01){\n      $('kNecessario').textContent = 'Meta não batida';\n      $('kNecessarioDet').textContent = `faltaram ${fmtMoeda(r.faltaMes)} em ${r.mesLabel}`;\n    } else {\n      $('kNecessario').textContent = 'Meta batida';\n      $('kNecessarioDet').textContent = `superada em ${fmtMoeda(-r.faltaMes)} em ${r.mesLabel}`;\n    }\n  } else {\n    // mês corrente\n    bloco.style.display = 'grid';\n    rotuloDias.textContent = 'Dias restantes para a meta';\n    $('kDias').textContent = `${r.diasRestantes} dia${r.diasRestantes!==1?'s':''}`;\n    $('kDiasDet').textContent = `até 31 · ${r.mesLabel} (dia ${r.diasDecorridos} de ${r.diasNoMes}, hoje incluso)`;\n\n    rotuloNecessario.textContent = 'Necessário por dia';\n    if(r.faltaMes > 0.01){\n      $('kNecessario').textContent = fmtMoeda(r.necessarioPorDia) + '/dia';\n      $('kNecessarioDet').textContent = `para bater a meta de ${r.mesLabel} nos dias restantes`;\n    } else {\n      $('kNecessario').textContent = 'Meta batida';\n      $('kNecessarioDet').textContent = `superada em ${fmtMoeda(-r.faltaMes)}`;\n    }\n  }\n\n  // ── Quanto fizemos ontem (mês corrente) / Último dia registrado (mês fechado) ──\n  const o = calcOntem();\n  if(!o || o.semReferencia){\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = '—';\n    $('kOntemDet').textContent = o ? 'fora dos meses disponíveis' : '';\n  } else if(o.status === 'fechado'){\n    rotuloOntem.textContent = 'Último dia registrado';\n    if(o.semDado){\n      $('kOntem').textContent = '—';\n      $('kOntemDet').textContent = `${o.mesLabel} · sem registro`;\n    } else {\n      $('kOntem').textContent = fmtMoeda(o.valor);\n      $('kOntemDet').textContent = `dia ${o.dia} · ${o.mesLabel} (fechamento do mês)`;\n    }\n  } else if(o.semDado){\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = fmtMoeda(0);\n    $('kOntemDet').textContent = `dia ${o.dia||''} · ${o.mesLabel||''} · sem registro`.trim();\n  } else {\n    rotuloOntem.textContent = 'Quanto fizemos ontem';\n    $('kOntem').textContent = fmtMoeda(o.valor);\n    $('kOntemDet').textContent = `dia ${o.dia} · ${o.mesLabel}`;\n  }\n\n  renderGraficoLinha();\n}\n\n// ── Gráfico de linha: variação diária do mês de referência (data de atualização) ──\n// Calcula um passo \"redondo\" para o eixo (1/2/2,5/5/10 × potência de 10) a partir do valor\n// máximo e do nº de divisões desejado — mesmo algoritmo usado por bibliotecas de gráfico\n// para evitar marcações \"picadas\" como 6.434, 12.869, 19.303.\nfunction passoNiceEixo(valorMax, divisoesAlvo){\n  if(valorMax<=0) return 1;\n  const passoBruto = valorMax/divisoesAlvo;\n  const magnitude = Math.pow(10, Math.floor(Math.log10(passoBruto)));\n  const normalizado = passoBruto/magnitude;\n  let niceNormalizado;\n  if(normalizado<=1) niceNormalizado=1;\n  else if(normalizado<=2) niceNormalizado=2;\n  else if(normalizado<=2.5) niceNormalizado=2.5;\n  else if(normalizado<=5) niceNormalizado=5;\n  else niceNormalizado=10;\n  return niceNormalizado*magnitude;\n}\n\nfunction renderGraficoLinha(){\n  const svg = $('graficoLinha');\n  const r = calcRitmo();\n  svg.innerHTML = '';\n\n  if(!r || r.status === 'futuro'){\n    $('graficoLinhaSub').textContent = 'sem mês de referência para o período informado';\n    svg.innerHTML = '<text x=\"460\" y=\"130\" text-anchor=\"middle\" fill=\"var(--tinta-2)\" font-size=\"15\" font-family=\"Public Sans\">Informe uma data dentro dos meses disponíveis.<\/text>';\n    return;\n  }\n\n  const dadosBrutos = DADOS.diarioTotal[r.idx] || {};\n  const diasComVenda = Object.keys(dadosBrutos).map(Number);\n  const ultimoDiaComDado = diasComVenda.length ? Math.max(...diasComVenda) : (r.diasDecorridos || r.diasNoMes);\n  $('graficoLinhaSub').textContent = `evolução dia a dia — ${r.mesLabel} (até o dia ${ultimoDiaComDado})`;\n\n  if(!diasComVenda.length){\n    svg.innerHTML = '<text x=\"460\" y=\"130\" text-anchor=\"middle\" fill=\"var(--tinta-2)\" font-size=\"15\" font-family=\"Public Sans\">Sem dados diários para este mês.<\/text>';\n    return;\n  }\n\n  // Preenche TODOS os dias de 1 até o último dia com dado (dias sem venda = 0),\n  // para que o eixo X reflita corretamente o calendário e não pule dias.\n  const dias = [];\n  const dados = {};\n  for(let d=1; d<=ultimoDiaComDado; d++){\n    dias.push(d);\n    dados[d] = dadosBrutos[d] ?? 0;\n  }\n\n  const W=920,H=260,mL=70,mR=18,mT=18,mB=34;\n  const iw=W-mL-mR, ih=H-mT-mB;\n  const valores = dias.map(d=>dados[d]);\n  const maxYRaw = Math.max(...valores, 1);\n  // Eixo Y com números redondos (10.000 / 20.000 / 30.000...) em vez de dividir o pico em\n  // partes iguais (o que gerava números \"picados\" tipo 6.434, 12.869, 19.303).\n  const niceStep = passoNiceEixo(maxYRaw, 4);\n  const maxY = Math.ceil(maxYRaw/niceStep)*niceStep || niceStep;\n  const x = i => mL + (dias.length===1 ? iw/2 : iw*i/(dias.length-1));\n  const y = v => mT + ih - (v/maxY)*ih;\n\n  let g='';\n  const passos = Math.round(maxY/niceStep);\n  for(let i=0;i<=passos;i++){\n    const v=niceStep*i, yy=y(v);\n    g+=`<line x1=\"${mL}\" y1=\"${yy.toFixed(1)}\" x2=\"${W-mR}\" y2=\"${yy.toFixed(1)}\" stroke=\"#D7DECD\" stroke-width=\"1\"/>`;\n    g+=`<text x=\"${mL-10}\" y=\"${(yy+4).toFixed(1)}\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#5B6B54\" font-family=\"Public Sans\">${fmtNum(v)}<\/text>`;\n  }\n\n  const pontos = dias.map((d,i)=>`${x(i).toFixed(1)},${y(dados[d]).toFixed(1)}`).join(' ');\n  const areaPontos = `${x(0).toFixed(1)},${y(0).toFixed(1)} ${pontos} ${x(dias.length-1).toFixed(1)},${y(0).toFixed(1)}`;\n  g += `<polygon points=\"${areaPontos}\" fill=\"#3E5C37\" opacity=\"0.10\"/>`;\n  g += `<polyline points=\"${pontos}\" fill=\"none\" stroke=\"#3E5C37\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>`;\n\n  const passoLabel = Math.max(1, Math.ceil(dias.length/10));\n  dias.forEach((d,i)=>{\n    g += `<circle cx=\"${x(i).toFixed(1)}\" cy=\"${y(dados[d]).toFixed(1)}\" r=\"3.2\" fill=\"#3E5C37\" data-i=\"${i}\" class=\"ptoLinha\"/>`;\n    if(i % passoLabel === 0 || i===dias.length-1){\n      g += `<text x=\"${x(i).toFixed(1)}\" y=\"${H-10}\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1C2419\" font-family=\"Public Sans\">${d}<\/text>`;\n    }\n  });\n\n  svg.innerHTML = g;\n\n  const tip = $('tipGraficoLinha');\n  svg.querySelectorAll('.ptoLinha').forEach(pt=>{\n    pt.addEventListener('mousemove', ()=>{\n      const i = +pt.dataset.i;\n      const d = dias[i];\n      const rectSvg = svg.getBoundingClientRect();\n      const bbox = pt.getBoundingClientRect();\n      tip.innerHTML = `<strong>Dia ${d}<\/strong> · ${fmtMoeda(dados[d])}`;\n      tip.style.left = (bbox.left - rectSvg.left + bbox.width/2) + 'px';\n      tip.style.top = (bbox.top - rectSvg.top) + 'px';\n      tip.style.opacity = 1;\n    });\n    pt.addEventListener('mouseleave', ()=>{ tip.style.opacity=0; });\n  });\n}\n\n// ── Data de atualização: apenas informativa (não filtra nada), default = hoje.\n// Serve de referência para os cartões de ritmo e também define, na carga inicial,\n// qual mês fica marcado sozinho no filtro de período. ──\nfunction mesCorrentePorData(inputVal){\n  if(!inputVal) return -1;\n  const [anoStr, mesStr] = inputVal.split('-');\n  const ano = parseInt(anoStr,10), mes = parseInt(mesStr,10);\n  return DADOS.meses.findIndex(label=>{\n    const p = parseMesLabel(label);\n    return p.ano===ano && p.mes===mes;\n  });\n}\n\n(function initDataAtualizacao(){\n  const input = $('dataAtualizacao');\n  const hoje = new Date();\n  const iso = hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0') + '-' + String(hoje.getDate()).padStart(2,'0');\n  input.value = iso;\n  $('hdrDataAtualizacao').textContent = input.value.split('-').reverse().join('/');\n  input.addEventListener('change', ()=>{\n    $('hdrDataAtualizacao').textContent = input.value ? input.value.split('-').reverse().join('/') : '–';\n    renderRitmo();\n  });\n\n  // Visualização padrão: apenas o mês corrente marcado no filtro de período\n  const idxCorrente = mesCorrentePorData(iso);\n  if(idxCorrente !== -1){\n    st.meses = new Set([idxCorrente]);\n  }\n})();\n\nmontaToggles();\nmontaFiltroDias();\nrender();\n\n<\/script>\n<\/body>\n<\/html>\n", "closers": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Performance Comercial — Closers HOD · Maio a Outubro/26<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21; --verde-2:#3E5C37; --verde-3:#4F7345;\n  --fundo:#F5F6F2; --mdf:#E7EEE3; --linha:#D7DECD;\n  --tinta:#1C2419; --tinta-2:#5B6B54; --card:#FFFFFF;\n  --acima:#3E5C37; --acima-bg:#E3EEDD;\n  --perto:#6F7768; --perto-bg:#ECEEE8;\n  --abaixo:#9A6B2F; --abaixo-bg:#F5EADB;\n  --barra:#4F7345; --barra-bg:#EEF2EA;\n  --alerta-bg:#FBF6EA; --alerta-borda:#E6D3A6;\n  --raio:10px;\n  box-sizing:border-box;\n  padding-top:env(safe-area-inset-top,0px);\n  padding-bottom:env(safe-area-inset-bottom,0px);\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --fundo:#141A12; --card:#1C241A; --mdf:#243021; --linha:#33412F;\n    --tinta:#E8EDE4; --tinta-2:#A3B39B;\n    --acima:#9AC98A; --acima-bg:#25381F; --perto:#B5BCAE; --perto-bg:#2A3127;\n    --abaixo:#E0B46E; --abaixo-bg:#3A2F1C; --barra:#7FA571; --barra-bg:#243021;\n    --alerta-bg:#2A2617; --alerta-borda:#4E4428;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --fundo:#141A12; --card:#1C241A; --mdf:#243021; --linha:#33412F;\n  --tinta:#E8EDE4; --tinta-2:#A3B39B;\n  --acima:#9AC98A; --acima-bg:#25381F; --perto:#B5BCAE; --perto-bg:#2A3127;\n  --abaixo:#E0B46E; --abaixo-bg:#3A2F1C; --barra:#7FA571; --barra-bg:#243021;\n  --alerta-bg:#2A2617; --alerta-borda:#4E4428;\n}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);color:var(--tinta);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}\n@media (prefers-reduced-motion: reduce){*{transition:none!important}}\nh1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;letter-spacing:-.01em}\n\nheader{background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,0) 40%),#263A21;color:#F5F6F2;border-bottom:4px solid #4F7345;padding:24px 20px 22px}\n.wrap{max-width:1240px;margin:0 auto}\nheader .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}\nh1{font-size:clamp(22px,3.2vw,32px);font-weight:700;line-height:1.1}\n.periodo{font-size:15px;color:#C7D6C1;margin-top:4px}\n.fonte{font-size:12.5px;color:#B9CBB1;text-align:right;max-width:420px}\n\nmain{max-width:1240px;margin:0 auto;padding:20px 20px 64px}\nsection{margin-top:34px}\n.sec-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:14px}\nh2{font-size:20px;font-weight:600}\n.sub{font-size:13px;color:var(--tinta-2)}\n\n/* Pontos de atenção */\n.atencao{background:var(--alerta-bg);border:1px solid var(--alerta-borda);border-radius:var(--raio);padding:14px 18px}\n.atencao summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;gap:10px;align-items:center}\n.atencao summary::-webkit-details-marker{display:none}\n.atencao summary::before{content:\"▸\";transition:transform .15s}\n.atencao[open] summary::before{transform:rotate(90deg)}\n.atencao ul{margin:12px 0 4px 20px;font-size:13.5px;display:grid;gap:7px;max-width:95ch}\n.atencao li strong{font-weight:600}\n.leitura{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--alerta-borda);font-size:13.5px}\n.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--card)}\n.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--tinta);padding:7px 12px;cursor:pointer}\n.seg button+button{border-left:1px solid var(--linha)}\n.seg button[aria-pressed=\"true\"]{background:var(--verde);color:#F5F6F2}\n.seg button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n\n/* KPIs */\n.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n.kpi{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px 14px}\n.kpi .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.kpi .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:clamp(24px,2.6vw,32px);font-weight:600;line-height:1.15;margin-top:4px}\n.kpi .det{font-size:12.5px;color:var(--tinta-2);margin-top:4px}\n.kpi.dest{background:var(--verde);border-color:var(--verde)}\n.kpi.dest .rot,.kpi.dest .det{color:#C7D6C1}\n.kpi.dest .val{color:#F5F6F2}\n@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}\n\n/* Tabela */\n.tabela-box{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);overflow-x:auto}\ntable{width:100%;border-collapse:collapse;min-width:1000px;font-size:13.5px}\nth,td{padding:9px 8px;text-align:right;white-space:nowrap}\nth:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--card)}\nthead th:first-child{background:var(--mdf)}\ntr.media td:first-child{background:var(--mdf)}\nthead th{font-size:12.5px;font-weight:600;color:var(--tinta-2);background:var(--mdf);border-bottom:1px solid var(--linha);vertical-align:bottom}\ntbody td{border-bottom:1px solid var(--linha)}\ntbody tr:hover td{background:color-mix(in srgb,var(--mdf) 55%,transparent)}\ntd .n{font-weight:500}\ntd .chip{margin-left:5px}\ntr.media td{background:var(--mdf);font-weight:600;border-top:2px solid var(--verde-3)}\ntr.total td{font-weight:600;color:var(--tinta-2)}\ntr.total td:first-child,tr.media td:first-child{font-size:12.5px;letter-spacing:.02em}\n.nota{font-size:12.5px;color:var(--tinta-2);margin-top:10px;max-width:110ch}\n\n.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;min-width:40px;text-align:center}\n.chip.acima{color:var(--acima);background:var(--acima-bg)}\n.chip.perto{color:var(--perto);background:var(--perto-bg)}\n.chip.abaixo{color:var(--abaixo);background:var(--abaixo-bg)}\n.chip.na{color:var(--tinta-2);background:transparent}\n.legenda{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px;color:var(--tinta-2);margin-top:10px;align-items:center}\n\n/* Comparação com a média */\n.painel{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:18px 20px}\n.painel-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}\n.ref{font-size:13.5px;color:var(--tinta-2)}\n.ref strong{color:var(--tinta)}\n.barras{display:grid;gap:9px}\n.linha-b{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;align-items:center;font-size:14px}\n.trilho{position:relative;height:20px;background:var(--barra-bg);border-radius:4px}\n.trilho .b{position:absolute;left:0;top:0;bottom:0;background:var(--barra);border-radius:4px;transition:width .35s ease}\n.trilho .m{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--tinta);opacity:.7}\n.linha-b .v{display:flex;justify-content:flex-end;gap:8px;align-items:center}\n.eixo-m{display:grid;grid-template-columns:140px 1fr 210px;gap:14px;font-size:12px;color:var(--tinta-2)}\n.eixo-m .t{position:relative;height:16px}\n.eixo-m .t span{position:absolute;transform:translateX(-50%);white-space:nowrap}\n@media (max-width:640px){\n  .linha-b,.eixo-m{grid-template-columns:86px 1fr;}\n  .linha-b .v{grid-column:2;justify-content:flex-start;margin-top:-4px}\n  .eixo-m>div:last-child{display:none}\n}\n\n/* Individual */\n.ind-top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}\nselect{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--card);color:var(--tinta);min-width:220px}\n.ind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}\n@media (max-width:860px){.ind-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px}\n.tile .rot{font-size:13px;color:var(--tinta-2);font-weight:500}\n.tile .val{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}\n.tile .cmp{font-size:12.5px;color:var(--tinta-2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n.mini{margin-top:10px;display:grid;gap:4px}\n.mini div{height:6px;border-radius:3px}\n.mini .c{background:var(--barra)}\n.mini .md{background:var(--tinta-2);opacity:.45}\n.compl{margin-top:12px;font-size:13.5px;color:var(--tinta-2)}\n.compl strong{color:var(--tinta)}\nfooter{max-width:1180px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--tinta-2)}\n\n.abas{display:flex;gap:4px;border-bottom:1px solid var(--linha);margin-top:26px;flex-wrap:wrap}\n.abas button{font:inherit;font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:17px;font-weight:600;border:0;background:transparent;color:var(--tinta-2);padding:10px 16px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}\n.abas button[aria-selected=\"true\"]{color:var(--tinta);border-bottom-color:var(--verde-3)}\n.abas button:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n.aviso-sec{font-size:13px;color:var(--tinta-2);background:var(--card);border:1px solid var(--linha);border-left:3px solid var(--alerta-borda);border-radius:6px;padding:10px 14px;margin-top:22px;max-width:110ch}\n.aviso-sec strong{color:var(--tinta)}\n[hidden]{display:none!important}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"wrap\">\n    <div>\n      <h1>Performance Comercial — Closers HOD<\/h1>\n      <div class=\"periodo\">Maio a Outubro de 2026 · outubro em andamento, reuniões e vendas até 14/10<\/div>\n    <\/div>\n    <div class=\"fonte\">Reuniões e vendas: abas GERAL MAI a OUT e abas individuais de setembro e outubro. Faturamento: dashboard financeiro HOD.<\/div>\n  <\/div>\n<\/header>\n\n<main>\n\n  <div class=\"abas\" role=\"tablist\" style=\"margin-top:4px\">\n    <button type=\"button\" role=\"tab\" aria-selected=\"true\" data-aba=\"mes\" id=\"tab-mes\">Time · maio a outubro<\/button>\n    <button type=\"button\" role=\"tab\" aria-selected=\"false\" data-aba=\"closer\" id=\"tab-closer\">Closers · setembro e outubro<\/button>\n  <\/div>\n\n  <div id=\"aba-mes\" role=\"tabpanel\" aria-labelledby=\"tab-mes\">\n    <section>\n      <div class=\"sec-head\"><h2>Maio a setembro<\/h2><span class=\"sub\">meses fechados<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Outubro em andamento<\/h2><span class=\"sub\">01 a 14/10<\/span><\/div>\n      <div class=\"kpis\" id=\"mes-kpis-out\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo mensal<\/h2><span class=\"sub\">indicador ao lado de cada valor = distância da média mensal do período<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"mes-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média mensal = média simples dos meses fechados (maio a setembro); outubro, em andamento, não entra na média nem no total. Total do período = soma para reuniões, vendas e faturamento; conversão e ticket do total são calculados sobre os somatórios. Vendas de Follow começaram em setembro; com só um mês fechado, ainda não há média para comparação.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média mensal<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"mes-seg\"><\/div><div class=\"ref\" id=\"mes-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"mes-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento mensal<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"mes-sel\" class=\"sub\">Mês<\/label><select id=\"mes-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"mes-grid\"><\/div>\n      <p class=\"compl\" id=\"mes-compl\"><\/p>\n    <\/section>\n  <\/div>\n\n  <div id=\"aba-closer\" role=\"tabpanel\" aria-labelledby=\"tab-closer\" hidden>\n    <div class=\"ind-top\" style=\"margin-top:22px\"><label for=\"closer-mes\" class=\"sub\">Mês<\/label><div class=\"seg\" role=\"group\" aria-label=\"Mês\" id=\"closer-mes\"><button type=\"button\" data-mes=\"Setembro\" aria-pressed=\"false\">Setembro<\/button><button type=\"button\" data-mes=\"Outubro\" aria-pressed=\"true\">Outubro (até 14/10)<\/button><\/div><\/div>\n    <p class=\"aviso-sec\" id=\"closer-aviso\"><\/p>\n    <section>\n      <div class=\"sec-head\"><h2 id=\"closer-titulo\">Visão geral do time<\/h2><span class=\"sub\" id=\"closer-sub\"><\/span><\/div>\n      <div class=\"kpis\" id=\"closer-kpis\"><\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparativo dos closers<\/h2><span class=\"sub\">ordem alfabética · indicador = distância da média dos closers<\/span><\/div>\n      <div class=\"tabela-box\"><table id=\"closer-tabela\"><\/table><\/div>\n      <div class=\"legenda\">\n        <span><span class=\"chip acima\">+12%<\/span> acima da média<\/span>\n        <span><span class=\"chip perto\">−4%<\/span> próximo da média (até ±10%)<\/span>\n        <span><span class=\"chip abaixo\">−25%<\/span> abaixo da média<\/span>\n      <\/div>\n      <p class=\"nota\">Média dos closers = média simples dos resultados individuais do mês selecionado (ticket médio e % Follow só entre closers com vendas). Total do time = soma para reuniões, vendas, faturamento e Follow; conversão, ticket e % Follow do total são calculados sobre os somatórios.<\/p>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Comparação com a média dos closers<\/h2><span class=\"sub\">a linha tracejada marca a média<\/span><\/div>\n      <div class=\"painel\">\n        <div class=\"painel-top\"><div class=\"seg\" role=\"group\" aria-label=\"Métrica\" id=\"closer-seg\"><\/div><div class=\"ref\" id=\"closer-ref\"><\/div><\/div>\n        <div class=\"barras\" id=\"closer-barras\"><\/div>\n      <\/div>\n    <\/section>\n    <section>\n      <div class=\"sec-head\"><h2>Detalhamento individual<\/h2><\/div>\n      <div class=\"ind-top\"><label for=\"closer-sel\" class=\"sub\">Closer<\/label><select id=\"closer-sel\"><\/select><\/div>\n      <div class=\"ind-grid\" id=\"closer-grid\"><\/div>\n      <p class=\"compl\" id=\"closer-compl\"><\/p>\n    <\/section>\n  <\/div>\n  <section>\n  <details class=\"atencao\">\n    <summary>Pontos de atenção nos dados (clique para expandir)<\/summary>\n    <ul>\n      <li><strong>Outubro é mês em andamento<\/strong>, com reuniões e vendas lançadas de 01 a 14/10. Fica fora da média mensal e do total do período; volumes (reuniões, vendas, faturamento) não são comparados com meses fechados, só a taxa de conversão e o % de Follow.<\/li>\n      <li><strong>Túlio tem R$ 619,00 de faturamento em outubro<\/strong>, mas a aba dele foi desconsiderada. Fica fora da visão por closer (R$ 117.393,84) e dentro da visão mensal, que soma todos os closers do dashboard financeiro (R$ 118.012,84). Por isso o ticket médio de outubro é R$ 2.863,26 na visão por closer e R$ 2.878,36 na visão mensal.<\/li>\n      <li><strong>Closers em outubro:<\/strong> abas de Misael e Túlio desconsideradas, conforme orientação; 7 closers na média. Eduardo e Alvaro agora têm lançamentos. Dias sem preenchimento contados como zero.<\/li>\n      <li><strong>Aba do Paulo (outubro) com datas deslocadas:<\/strong> falta a linha de 03/10, então a partir daí cada lançamento está um dia à frente da data real. A distribuição por dia também difere da GERAL OUT em outros dias, mas o total do mês da soma das 7 abas bate com a GERAL OUT em todas as métricas (381 agendadas, 199 realizadas, 41 vendas, 60 leads em Follow, 25 vendas de Follow).<\/li>\n      <li><strong>Setembro: 111 vendas no consolidado × 107 nas abas por closer.<\/strong> A diferença está em 24/09 (8 vendas na GERAL SET, 4 nas abas individuais), ainda não atribuída a nenhum closer. A visão por closer de setembro usa as abas individuais da versão anterior.<\/li>\n      <li><strong>Coluna H com 0,01 e 0,02 em setembro:<\/strong> leitura padrão “0,01 = 1 venda”, com base na correção feita nos lançamentos de Eduardo. Outubro não tem esse tipo de lançamento.<\/li>\n      <li><strong>Faturamento de setembro:<\/strong> a visão mensal soma todos os closers do dashboard financeiro (R$ 290.949,71, inclui Rafael com R$ 4.299,93); a visão por closer soma só os 9 closers com aba (R$ 286.649,78). Na versão atualizada, Larissa ganhou R$ 1.795,20 em setembro em relação à versão anterior. Maio a agosto seguem o critério da visão mensal.<\/li>\n      <li><strong>Alvaro<\/strong> tem lançamentos só até 04/09 e R$ 0 como closer em setembro. Ticket médio e % Follow não existem para quem não teve vendas, então essas médias usam só os closers com venda.<\/li>\n    <\/ul>\n    <div class=\"leitura\">\n      <span>Leitura da coluna H:<\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Leitura das vendas de Follow\">\n        <button type=\"button\" data-l=\"B\" aria-pressed=\"true\">0,01 = 1 venda<\/button>\n        <button type=\"button\" data-l=\"A\" aria-pressed=\"false\">Como exibido na planilha (0,01 = 0)<\/button>\n      <\/div>\n      <span class=\"sub\" id=\"leituraInfo\"><\/span>\n    <\/div>\n  <\/details>\n  <\/section>\n<\/main>\n<footer>Valores recalculados a partir das linhas diárias; dias sem preenchimento considerados como zero. Vendas = coluna VENDAS; Vendas de Follow = coluna VENDA FOLLOW; leads enviados para Follow (coluna FOLLOW) aparecem só como dado complementar.<\/footer>\n\n<script>\nconst MESES = [{\"nome\": \"Maio\", \"ag\": 1083, \"real\": 608, \"vendas\": 117, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 302599.15}, {\"nome\": \"Junho\", \"ag\": 1093, \"real\": 625, \"vendas\": 140, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 385894.26}, {\"nome\": \"Julho\", \"ag\": 982, \"real\": 588, \"vendas\": 137, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 384660.12}, {\"nome\": \"Agosto\", \"ag\": 1126, \"real\": 755, \"vendas\": 118, \"follow\": null, \"vfA\": null, \"vfB\": null, \"fat\": 347698.84}, {\"nome\": \"Setembro\", \"ag\": 1023, \"real\": 634, \"vendas\": 111, \"follow\": 108, \"vfA\": 46, \"vfB\": 57, \"fat\": 290949.71}, {\"nome\": \"Outubro\", \"parcial\": true, \"ag\": 381, \"real\": 199, \"vendas\": 41, \"follow\": 60, \"vfA\": 25, \"vfB\": 25, \"fat\": 118012.84}];\nconst CLOSERS = {\"Setembro\": [{\"nome\": \"Alvaro\", \"ag\": 20, \"real\": 13, \"vendas\": 0, \"follow\": 2, \"vfA\": 0, \"vfB\": 0, \"fat\": 0}, {\"nome\": \"Eduardo\", \"ag\": 77, \"real\": 41, \"vendas\": 14, \"follow\": 21, \"vfA\": 5, \"vfB\": 8, \"fat\": 47918.11}, {\"nome\": \"Larissa\", \"ag\": 88, \"real\": 63, \"vendas\": 9, \"follow\": 3, \"vfA\": 2, \"vfB\": 2, \"fat\": 26180.66}, {\"nome\": \"Leandro Portuga\", \"ag\": 98, \"real\": 58, \"vendas\": 18, \"follow\": 4, \"vfA\": 13, \"vfB\": 13, \"fat\": 49028.94}, {\"nome\": \"Luigi\", \"ag\": 154, \"real\": 88, \"vendas\": 11, \"follow\": 28, \"vfA\": 6, \"vfB\": 6, \"fat\": 17930.55}, {\"nome\": \"Misael\", \"ag\": 85, \"real\": 53, \"vendas\": 5, \"follow\": 0, \"vfA\": 1, \"vfB\": 5, \"fat\": 14478.4}, {\"nome\": \"Paulo\", \"ag\": 160, \"real\": 102, \"vendas\": 10, \"follow\": 7, \"vfA\": 0, \"vfB\": 0, \"fat\": 29337.11}, {\"nome\": \"Rodrigo\", \"ag\": 211, \"real\": 136, \"vendas\": 13, \"follow\": 34, \"vfA\": 0, \"vfB\": 7, \"fat\": 42900.42}, {\"nome\": \"Túlio\", \"ag\": 130, \"real\": 80, \"vendas\": 27, \"follow\": 9, \"vfA\": 16, \"vfB\": 16, \"fat\": 58875.59}], \"Outubro\": [{\"nome\": \"Alvaro\", \"ag\": 38, \"real\": 13, \"vendas\": 2, \"follow\": 3, \"vfA\": 0, \"vfB\": 0, \"fat\": 5976.0}, {\"nome\": \"Eduardo\", \"ag\": 25, \"real\": 12, \"vendas\": 3, \"follow\": 10, \"vfA\": 1, \"vfB\": 1, \"fat\": 9522.27}, {\"nome\": \"Larissa\", \"ag\": 26, \"real\": 19, \"vendas\": 3, \"follow\": 0, \"vfA\": 1, \"vfB\": 1, \"fat\": 10927.0}, {\"nome\": \"Leandro Portuga\", \"ag\": 67, \"real\": 37, \"vendas\": 13, \"follow\": 19, \"vfA\": 11, \"vfB\": 11, \"fat\": 39083.52}, {\"nome\": \"Luigi\", \"ag\": 66, \"real\": 34, \"vendas\": 8, \"follow\": 13, \"vfA\": 5, \"vfB\": 5, \"fat\": 12908.49}, {\"nome\": \"Paulo\", \"ag\": 72, \"real\": 35, \"vendas\": 7, \"follow\": 5, \"vfA\": 7, \"vfB\": 7, \"fat\": 25927.92}, {\"nome\": \"Rodrigo\", \"ag\": 87, \"real\": 49, \"vendas\": 5, \"follow\": 10, \"vfA\": 0, \"vfB\": 0, \"fat\": 13048.64}]};\nconst AVISOS = {\n  Setembro: '<strong>Base: abas individuais de setembro (versão anterior da planilha).<\/strong> Somam 107 vendas, contra 111 no consolidado do mês — diferença de 4 vendas em 24/09, ainda não atribuída a nenhum closer. Faturamento: 9 closers com aba.',\n  Outubro: '<strong>Mês em andamento: reuniões, vendas e faturamento de 01 a 14/10.<\/strong> 7 closers (Misael e Túlio desconsiderados); faturamento soma só os 7 closers com aba.'\n};\nconst st = { leitura:'B' };\n\nconst fmtInt = n => n.toLocaleString('pt-BR',{maximumFractionDigits:0});\nconst fmtDec = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});\nconst fmtR = n => 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst fmtPct = n => n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';\n\nconst METRICAS = [\n  {k:'ag',     nome:'Reuniões agendadas', curto:'Agendadas',  fmt:fmtInt, mfmt:fmtDec},\n  {k:'real',   nome:'Reuniões realizadas',curto:'Realizadas', fmt:fmtInt, mfmt:fmtDec},\n  {k:'vendas', nome:'Vendas realizadas',  curto:'Vendas',     fmt:fmtInt, mfmt:fmtDec},\n  {k:'conv',   nome:'Taxa de conversão',  curto:'Conversão',  fmt:fmtPct, mfmt:fmtPct, taxa:true},\n  {k:'fat',    nome:'Faturamento',        curto:'Faturamento',fmt:fmtR,   mfmt:fmtR},\n  {k:'ticket', nome:'Ticket médio',       curto:'Ticket médio', fmt:fmtR, mfmt:fmtR, taxa:true},\n  {k:'vf',     nome:'Vendas de Follow',   curto:'Vendas Follow', fmt:fmtInt, mfmt:fmtDec},\n  {k:'pvf',    nome:'% de vendas de Follow', curto:'% Follow', fmt:fmtPct, mfmt:fmtPct, taxa:true},\n];\nconst GRAF = [['vendas','Vendas'],['conv','Conversão'],['fat','Faturamento'],['ticket','Ticket médio'],['real','Reuniões realizadas']];\n\nfunction enrich(r){\n  const vf = r.vfA===null ? null : (st.leitura==='A' ? r.vfA : r.vfB);\n  return {...r, vf,\n    conv: r.real ? r.vendas/r.real*100 : null,\n    ticket: (r.fat!==null && r.vendas && !r.semTicket) ? r.fat/r.vendas : null,\n    pvf: (vf!==null && r.vendas) ? vf/r.vendas*100 : null};\n}\nfunction calc(rows){\n  const cl = rows.map(enrich);\n  const base = cl.filter(c=>!c.parcial);\n  const media={}, n={};\n  METRICAS.forEach(m=>{\n    const vals = base.map(c=>c[m.k]).filter(v=>v!==null);\n    n[m.k]=vals.length;\n    media[m.k] = vals.length>1 ? vals.reduce((a,b)=>a+b,0)/vals.length : null;\n  });\n  return {cl, media, n, t: totais(base)};\n}\nfunction totais(rows){\n  const t={ag:0,real:0,vendas:0,fat:0,vf:0,follow:0,vendasF:0,semFat:false};\n  rows.forEach(c=>{['ag','real','vendas'].forEach(k=>t[k]+=c[k]); if(c.fat===null) t.semFat=true; else t.fat+=c.fat; if(c.semTicket) t.semTicket=true;\n    if(c.vf!==null){t.vf+=c.vf;t.follow+=c.follow;t.vendasF+=c.vendas;}});\n  t.conv=t.real? t.vendas/t.real*100 : null;\n  if(t.semFat){t.fat=null;t.ticket=null;} else t.ticket=(t.vendas && !t.semTicket)? t.fat/t.vendas : null;\n  t.pvf=t.vendasF? t.vf/t.vendasF*100 : null;\n  return t;\n}\n\nfunction chip(v, m){\n  if(v===null || m===null || !m) return '';\n  const d=v/m-1, r=Math.round(d*100);\n  const cls = Math.abs(d)<=0.10 ? 'perto' : (r>0?'acima':'abaixo');\n  return `<span class=\"chip ${cls}\">${(r>0?'+':r<0?'−':'')+Math.abs(r)}%<\/span>`;\n}\n// mês parcial: só taxas são comparáveis com a média de meses fechados\nconst chipRow = (c,m,med) => (c.parcial && !m.taxa) ? '' : chip(c[m.k],med);\nconst nd = '<span class=\"sub\">sem dado<\/span>';\nfunction kpiHTML(cards){ return cards.map(([r,v,d,dest])=>`<div class=\"kpi${dest?' dest':''}\"><div class=\"rot\">${r}<\/div><div class=\"val\">${v}<\/div>${d?`<div class=\"det\">${d}<\/div>`:''}<\/div>`).join(''); }\nconst opt = (v,f) => v===null ? '—' : f(v);\n\nconst VIEWS = {\n  mes: {\n    rows: ()=>MESES, rotulo:'Mês', mediaLbl:'MÉDIA MENSAL', totalLbl:'TOTAL MAI–SET', mediaRef:'Média mensal (mai–set)',\n    sel: 'Setembro', metrica:'vendas',\n    label: c => c.parcial ? `${c.nome} <span class=\"sub\">(até 14/10)<\/span>` : c.nome,\n    kpis(D){ const t=D.t, nf=MESES.filter(m=>!m.parcial).length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), `média de ${fmtDec(t.ag/nf)} por mês`],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), `média de ${fmtDec(t.vendas/nf)} por mês`],\n      ['Taxa de conversão', fmtPct(t.conv), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', fmtR(t.fat), `média de ${fmtR(t.fat/nf)} por mês`, true],\n      ['Ticket médio', fmtR(t.ticket), 'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), `acompanhamento desde setembro · ${fmtInt(t.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', fmtPct(t.pvf), `sobre ${t.vendasF} vendas de setembro`],\n    ];},\n    nMedia(){ return ''; },\n    semMedia: 'sem média de comparação ainda',\n  },\n  closer: {\n    rows: ()=>CLOSERS[VIEWS.closer.mes], rotulo:'Closer', mediaLbl:'MÉDIA DOS CLOSERS', totalLbl:'TOTAL DO TIME', mediaRef:'Média dos closers',\n    mes:'Outubro', sel: null, metrica:'vendas',\n    label: c => c.nome,\n    kpis(D){ const t=D.t, nc=D.cl.length; return [\n      ['Reuniões agendadas', fmtInt(t.ag), ''],\n      ['Reuniões realizadas', fmtInt(t.real), `${fmtPct(t.real/t.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(t.vendas), 'soma das abas individuais'],\n      ['Taxa de conversão', opt(t.conv,fmtPct), 'vendas ÷ reuniões realizadas', true],\n      ['Faturamento', t.fat===null?'Sem dado':fmtR(t.fat), t.fat===null?'aguardando dashboard financeiro de outubro':(t.semTicket?`${nc} closers com aba · só até 06/10`:`${nc} closers com aba`), true],\n      ['Ticket médio', t.ticket===null?'—':fmtR(t.ticket), t.semTicket?'não calculado: faturamento até 06/10, vendas até 14/10':'faturamento ÷ vendas'],\n      ['Vendas de Follow', fmtInt(t.vf), `${fmtInt(t.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', opt(t.pvf,fmtPct), 'vendas de Follow ÷ vendas'],\n    ];},\n    nMedia(m,D){ return D.media[m.k]!==null && D.n[m.k]<D.cl.length ? ` <span class=\"sub\">(${D.n[m.k]})<\/span>` : ''; },\n    semMedia: 'sem dado',\n  }\n};\n\nfunction renderView(id){\n  const V=VIEWS[id], D=calc(V.rows()), $=s=>document.getElementById(`${id}-${s}`);\n  if(V.sel===null || !D.cl.find(c=>c.nome===V.sel)) V.sel = D.cl[0].nome;\n  const fv=(m,v)=> v===null ? '<span class=\"sub\">—<\/span>' : m.fmt(v);\n  $('kpis').innerHTML = kpiHTML(V.kpis(D));\n  if(id==='mes'){\n    const o = enrich(MESES.find(m=>m.parcial));\n    $('kpis-out').innerHTML = kpiHTML([\n      ['Reuniões agendadas', fmtInt(o.ag), ''],\n      ['Reuniões realizadas', fmtInt(o.real), `${fmtPct(o.real/o.ag*100)} das agendadas`],\n      ['Vendas realizadas', fmtInt(o.vendas), ''],\n      ['Taxa de conversão', fmtPct(o.conv), `média mai–set: ${fmtPct(D.media.conv)} ${chip(o.conv,D.media.conv)}`, true],\n      ['Faturamento', fmtR(o.fat), 'todos os closers do dashboard financeiro', true],\n      ['Ticket médio', fmtR(o.ticket), `média mai–set: ${fmtR(D.media.ticket)} ${chip(o.ticket,D.media.ticket)}`],\n      ['Vendas de Follow', fmtInt(o.vf), `${fmtInt(o.follow)} leads enviados para Follow`],\n      ['% de vendas de Follow', fmtPct(o.pvf), `setembro: ${fmtPct(D.cl.find(c=>c.nome==='Setembro').pvf)} ${chip(o.pvf,D.cl.find(c=>c.nome==='Setembro').pvf)}`],\n    ]);\n  }\n  const t=D.t;\n  const tot={ag:fmtInt(t.ag),real:fmtInt(t.real),vendas:fmtInt(t.vendas),conv:opt(t.conv,fmtPct),fat:opt(t.fat,fmtR),ticket:opt(t.ticket,fmtR),\n    vf: id==='closer'?fmtInt(t.vf):'—', pvf: id==='closer'?opt(t.pvf,fmtPct):'—'};\n  $('tabela').innerHTML = `<thead><tr><th>${V.rotulo}<\/th>${METRICAS.map(m=>`<th>${m.curto}<\/th>`).join('')}<\/tr><\/thead><tbody>`+\n    D.cl.map(c=>`<tr${c.parcial?' style=\"font-style:italic\"':''}><td><span class=\"n\">${V.label(c)}<\/span><\/td>${METRICAS.map(m=>`<td>${fv(m,c[m.k])}${chipRow(c,m,D.media[m.k])}<\/td>`).join('')}<\/tr>`).join('')+\n    `<tr class=\"media\"><td>${V.mediaLbl}<\/td>${METRICAS.map(m=>`<td>${D.media[m.k]===null?'—':m.mfmt(D.media[m.k])}${V.nMedia(m,D)}<\/td>`).join('')}<\/tr>`+\n    `<tr class=\"total\"><td>${V.totalLbl}<\/td>${METRICAS.map(m=>`<td>${tot[m.k]}<\/td>`).join('')}<\/tr><\/tbody>`;\n  // Barras\n  $('seg').innerHTML = GRAF.map(([k,l])=>`<button type=\"button\" data-m=\"${k}\" aria-pressed=\"${V.metrica===k}\">${l}<\/button>`).join('');\n  const m=METRICAS.find(x=>x.k===V.metrica), med=D.media[m.k];\n  if(med===null){\n    $('ref').innerHTML=''; $('barras').innerHTML = `<p class=\"sub\">${m.nome}: sem dado neste período.<\/p>`;\n  } else {\n    const max=Math.max(...D.cl.map(c=>c[m.k]??0), med)*1.06||1, pm=med/max*100;\n    $('ref').innerHTML = `${V.mediaRef}: <strong>${m.mfmt(med)}<\/strong>${V.nMedia(m,D)}`;\n    $('barras').innerHTML = `<div class=\"eixo-m\"><div><\/div><div class=\"t\"><span style=\"left:${pm}%\">média ${m.mfmt(med)}<\/span><\/div><div><\/div><\/div>`+\n      D.cl.map(c=>{const v=c[m.k]; const op=c.parcial?'opacity:.45;':'';\n        return `<div class=\"linha-b\"><div>${V.label(c)}<\/div>\n        <div class=\"trilho\" role=\"img\" aria-label=\"${c.nome}: ${v===null?'sem dado':m.fmt(v)}\"><div class=\"b\" style=\"${op}width:${(v??0)/max*100}%\"><\/div><div class=\"m\" style=\"left:${pm}%\"><\/div><\/div>\n        <div class=\"v\"><span>${v===null?'sem dado':m.fmt(v)}<\/span>${chipRow(c,m,med)}<\/div><\/div>`;}).join('');\n  }\n  // Detalhe\n  const sel=$('sel');\n  sel.innerHTML = D.cl.map(r=>`<option${r.nome===V.sel?' selected':''}>${r.nome}<\/option>`).join('');\n  const c=D.cl.find(x=>x.nome===V.sel);\n  $('grid').innerHTML = METRICAS.map(m=>{\n    const v=c[m.k], med=D.media[m.k], comp = v!==null && med!==null && !(c.parcial && !m.taxa);\n    const mx=Math.max(v??0,med??0)||1;\n    const txt = comp ? 'média '+m.mfmt(med) : (v===null ? (m.k==='fat'||m.k==='ticket' ? (m.k==='ticket' && c.semTicket ? 'não calculado: faturamento até 06/10' : m.k==='ticket' && c.fat ? 'faturamento sem venda lançada' : 'sem vendas no período') : m.k==='conv' ? 'sem reuniões realizadas' : m.k==='pvf' ? 'sem vendas no período' : V.semMedia) : (c.parcial && !m.taxa ? 'mês em andamento' : 'sem média de comparação ainda'));\n    return `<div class=\"tile\"><div class=\"rot\">${m.nome}<\/div><div class=\"val\">${v===null?'—':m.fmt(v)}<\/div>\n      <div class=\"cmp\">${comp?chip(v,med):''}<span>${txt}<\/span><\/div>\n      ${comp?`<div class=\"mini\" aria-hidden=\"true\"><div class=\"c\" style=\"width:${v/mx*100}%\"><\/div><div class=\"md\" style=\"width:${med/mx*100}%\"><\/div><\/div>`:''}<\/div>`;\n  }).join('');\n  const quem = id==='mes'?'mês':'closer';\n  $('compl').innerHTML = (c.follow===null ? '' : `Dado complementar — leads enviados para Follow: <strong>${fmtInt(c.follow)}<\/strong>. `) +\n    `Barras: verde = ${quem}, cinza = média.` + (c.vfA!==null && c.vfA!==c.vfB ? ` Vendas de Follow: ${c.vfB} na leitura “0,01 = 1 venda” e ${c.vfA} na leitura como exibida.` : '');\n  if(id==='closer'){\n    document.querySelectorAll('#closer-mes button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mes===V.mes));\n    document.getElementById('closer-aviso').innerHTML = AVISOS[V.mes];\n    document.getElementById('closer-titulo').textContent = `Visão geral do time em ${V.mes.toLowerCase()}`;\n    document.getElementById('closer-sub').textContent = `${D.cl.length} closers` + (V.mes==='Outubro'?' · reuniões e vendas até 14/10':', incluindo Rodrigo');\n  }\n}\n\nfunction render(){\n  document.querySelectorAll('.leitura .seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===st.leitura));\n  const s=MESES.find(r=>r.nome==='Setembro');\n  document.getElementById('leituraInfo').textContent = `Setembro: ${st.leitura==='B'?s.vfB:s.vfA} vendas de Follow (a outra leitura dá ${st.leitura==='B'?s.vfA:s.vfB})`;\n  renderView('mes'); renderView('closer');\n}\n\ndocument.querySelector('.leitura .seg').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; st.leitura=b.dataset.l; render();});\n['mes','closer'].forEach(id=>{\n  document.getElementById(`${id}-seg`).addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; VIEWS[id].metrica=b.dataset.m; renderView(id);});\n  document.getElementById(`${id}-sel`).addEventListener('change', e=>{VIEWS[id].sel=e.target.value; renderView(id);});\n});\ndocument.getElementById('closer-mes').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b) return; VIEWS.closer.mes=b.dataset.mes; VIEWS.closer.sel=null; renderView('closer');});\ndocument.querySelector('.abas').addEventListener('click', e=>{\n  const b=e.target.closest('button'); if(!b) return;\n  document.querySelectorAll('.abas button').forEach(x=>x.setAttribute('aria-selected', x===b));\n  document.getElementById('aba-mes').hidden = b.dataset.aba!=='mes';\n  document.getElementById('aba-closer').hidden = b.dataset.aba!=='closer';\n});\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};
const NOMES = {vendas:'Dashboard comercial', closers:'Performance closers'};
function mostrar(v){
  if(!DASH[v]) v='vendas';
  for(const k in DASH){
    const f=document.getElementById('f-'+k);
    if(k===v && !f.srcdoc) f.srcdoc = DASH[k];
    f.hidden = k!==v;
  }
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.v===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.getElementById('atual').textContent = NOMES[v];
  document.title = 'HOD · ' + NOMES[v];
  document.body.classList.remove('aberto');
}
window.addEventListener('hashchange', ()=>mostrar(location.hash.slice(1)));
mostrar(location.hash.slice(1) || 'vendas');

});
