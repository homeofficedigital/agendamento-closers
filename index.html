<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOD · Painel Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B2A17; --side-2:#22341D; --side-linha:rgba(245,246,242,.10);
  --side-txt:#C7D6C1; --side-txt-forte:#F5F6F2; --ativo:#4F7345;
  --fundo:#F5F6F2; --w:256px; --w-min:68px;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fundo:#141A12; } }
:root[data-theme="dark"]{ --fundo:#141A12; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);display:flex;overflow:hidden}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

aside{width:var(--w);flex:0 0 var(--w);height:100%;background:var(--side);color:var(--side-txt);display:flex;flex-direction:column;border-right:1px solid var(--side-linha);transition:width .2s ease,flex-basis .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.marca{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:20px 16px 18px 20px;border-bottom:1px solid var(--side-linha)}
.marca .logo{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;color:var(--side-txt-forte);white-space:nowrap}
.marca .logo small{display:block;font-family:'Public Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-txt);opacity:.8;margin-top:2px}
.btn-ico{border:0;background:transparent;color:var(--side-txt);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 30px}
.btn-ico:hover{background:var(--side-2);color:var(--side-txt-forte)}
.btn-ico svg{width:18px;height:18px;transition:transform .2s}
nav{padding:14px 10px;display:grid;gap:4px}
.grupo{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-txt);opacity:.6;padding:10px 12px 6px;white-space:nowrap}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-txt);text-decoration:none;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden}
nav a svg{width:19px;height:19px;flex:0 0 19px}
nav a:hover{background:var(--side-2);color:var(--side-txt-forte)}
nav a[aria-current="page"]{background:var(--ativo);color:var(--side-txt-forte);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
nav a:focus-visible,.btn-ico:focus-visible{outline:2px solid #9AC98A;outline-offset:2px}
.rodape{margin-top:auto;padding:14px 20px 18px;border-top:1px solid var(--side-linha);font-size:12px;line-height:1.45;color:var(--side-txt);opacity:.75;white-space:nowrap;overflow:hidden}

/* recolhido */
body.min aside{width:var(--w-min);flex-basis:var(--w-min)}
body.min .marca{padding:20px 0 18px;justify-content:center}
body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:none}
body.min nav a{justify-content:center;padding:10px 0}
body.min .btn-ico svg{transform:rotate(180deg)}

main{flex:1;min-width:0;height:100%;position:relative}
iframe{border:0;width:100%;height:100%;display:block;background:var(--fundo)}
iframe[hidden]{display:none}

/* mobile */
.topo{display:none}
@media (max-width:820px){
  body{flex-direction:column}
  .topo{display:flex;align-items:center;gap:10px;background:var(--side);color:var(--side-txt-forte);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex:0 0 auto}
  .topo .logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px}
  .topo .atual{font-size:13px;color:var(--side-txt);margin-left:auto}
  aside{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s ease;width:var(--w)!important;flex-basis:auto!important;box-shadow:8px 0 24px rgba(0,0,0,.25)}
  body.aberto aside{transform:none}
  body.min .marca .logo, body.min .grupo, body.min nav a span, body.min .rodape{display:block}
  body.min nav a{justify-content:flex-start;padding:10px 12px}
  #recolher{display:none}
  .veu{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;display:none}
  body.aberto .veu{display:block}
  main{height:auto;flex:1}
}
</style>
</head>
<body>
<div class="topo">
  <button class="btn-ico" id="menu" aria-label="Abrir menu" style="color:#F5F6F2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <span class="logo">HOD</span>
  <span class="atual" id="atual"></span>
</div>
<div class="veu" id="veu"></div>
<aside aria-label="Navegação">
  <div class="marca">
    <div class="logo">HOD<small>Painel Comercial</small></div>
    <button class="btn-ico" id="recolher" aria-label="Recolher menu" title="Recolher menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  </div>
  <nav>
    <div class="grupo">Dashboards</div>
    <a href="#vendas" data-v="vendas" title="Dashboard comercial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/></svg><span>Dashboard comercial</span></a>
    <a href="#closers" data-v="closers" title="Performance closers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2c2.4-.3 4.4 1.2 5 4.3"/></svg><span>Performance closers</span></a>
  </nav>
  <div class="rodape">Home Office Digital</div>
</aside>
<main>
  <iframe id="f-vendas" title="Dashboard comercial" hidden></iframe>
  <iframe id="f-closers" title="Performance closers" hidden></iframe>
</main>
<script>
const DASH = {"vendas": "<!DOCTYPE html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Home Office Digital · Dashboard Comercial<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --verde:#263A21;\n  --verde-2:#3E5C37;\n  --verde-3:#4F7345;\n  --offwhite:#F5F6F2;\n  --mdf:#E7EEE3;\n  --mdf-2:#D7DECD;\n  --tinta:#1C2419;\n  --tinta-2:#5B6B54;\n  --branco:#FFFFFF;\n  --ouro:#D9A441;\n  --prata:#9B968A;\n  --bronze:#B4794A;\n  --raio:10px;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{\n  font-family:'Public Sans',system-ui,sans-serif;\n  background:var(--offwhite);\n  color:var(--tinta);\n  font-size:15px;\n  line-height:1.5;\n}\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important}\n}\n\n/* ── Header ─────────────────────────── */\nheader{\n  background:\n    linear-gradient(90deg, rgba(0,0,0,.20), rgba(0,0,0,0) 35%),\n    var(--verde);\n  color:var(--offwhite);\n  padding:22px 28px 20px;\n  border-bottom:4px solid var(--verde-3);\n}\n.header-inner{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}\n.header-brand{display:flex;align-items:center;gap:14px}\n.header-brand img{width:44px;height:44px;border-radius:9px}\n.brand-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B9CBB1;font-weight:600}\nh1{\n  font-family:'Bricolage Grotesque',sans-serif;\n  font-weight:700;font-size:clamp(22px,3.2vw,32px);\n  letter-spacing:-.01em;line-height:1.1;margin-top:2px;\n}\nh1 em{font-style:normal;color:#9AC98A}\n.header-periodo-resumo{font-size:13px;color:#C7D6C1;text-align:right}\n.header-periodo-resumo strong{color:var(--offwhite)}\n\n/* ── Layout ─────────────────────────── */\nmain{max-width:1180px;margin:0 auto;padding:22px 20px 64px}\nsection{margin-top:34px}\n.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}\nh2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.01em}\n.sec-head .sub{font-size:13px;color:var(--tinta-2)}\n\n/* ── Filtros ────────────────────────── */\n.filtros{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:18px 20px;margin-top:20px;\n  box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.filtro label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:10px}\n.filtro + .filtro{margin-top:18px}\n.periodo-toggles{display:flex;gap:10px;flex-wrap:wrap}\n.chip-mes{\n  font:inherit;font-size:14px;font-weight:600;color:var(--tinta);cursor:pointer;\n  background:var(--offwhite);border:1.5px solid var(--mdf-2);border-radius:99px;padding:9px 18px;\n  transition:background .15s,border-color .15s,color .15s;\n}\n.chip-mes:hover{background:var(--mdf)}\n.chip-mes.ativo{background:var(--verde);color:var(--offwhite);border-color:var(--verde)}\n.chip-mes:focus-visible{outline:2px solid var(--verde-3);outline-offset:2px}\n.filtro-data input[type=\"date\"]{\n  font:inherit;font-size:14px;color:var(--tinta);\n  background:var(--offwhite);border:1px solid var(--mdf-2);border-radius:8px;padding:9px 12px;\n}\n.filtro-data input[type=\"date\"]:focus-visible{outline:2px solid var(--verde-3);outline-offset:1px}\n.dias-toggles{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--tinta);margin-top:10px}\n.dias-toggles[hidden]{display:none}\n.dias-toggles input[type=\"date\"]{\n  font:inherit;font-size:14px;color:var(--tinta);\n  background:var(--offwhite);border:1px solid var(--mdf-2);border-radius:8px;padding:8px 10px;\n}\n.dias-toggles input[type=\"date\"]:focus-visible{outline:2px solid var(--verde-3);outline-offset:1px}\n.botao-toggle-dias{\n  font:inherit;font-size:13.5px;font-weight:600;color:var(--verde-2);\n  background:var(--offwhite);border:1px solid var(--mdf-2);border-radius:8px;padding:9px 14px;cursor:pointer;\n}\n.botao-toggle-dias:hover{background:var(--mdf)}\n.botao-toggle-dias.ativo{background:var(--verde);color:var(--offwhite);border-color:var(--verde)}\n#limparDias{\n  font:inherit;font-size:12.5px;font-weight:600;color:var(--verde-2);\n  background:none;border:1px solid var(--mdf-2);border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:4px;\n}\n#limparDias:hover{background:var(--mdf)}\n.info-atualizacao{\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;\n  font-size:12.5px;color:var(--tinta-2);\n}\n.info-atualizacao label{font-weight:600}\n.info-atualizacao input[type=\"date\"]{\n  font:inherit;font-size:13px;color:var(--tinta);\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:8px;padding:6px 10px;\n}\n.info-atualizacao input[type=\"date\"]:focus-visible{outline:2px solid var(--verde-3);outline-offset:1px}\n.filtros-rodape{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--mdf)}\n.contagem-filtro{font-size:13px;color:var(--tinta-2)}\n.contagem-filtro strong{color:var(--tinta)}\n#limpar{\n  font:inherit;font-size:13px;font-weight:600;color:var(--verde-2);\n  background:none;border:1px solid var(--mdf-2);border-radius:8px;padding:7px 14px;cursor:pointer;\n}\n#limpar:hover{background:var(--mdf)}\n\n/* ── KPIs ───────────────────────────── */\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}\n.kpi{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:16px 18px 14px;position:relative;overflow:hidden;\n}\n.kpi::before{content:\"\";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde-3)}\n.kpi.k-meta::before{background:var(--tinta-2)}\n.kpi.k-projecao::before{background:var(--ouro)}\n.kpi.k-atg::before{background:var(--bronze)}\n.kpi.k-evo::before{background:var(--verde-3)}\n.kpi.k-lowticket-valor::before{background:var(--prata)}\n.kpi.k-lowticket-qtd::before{background:var(--bronze)}\n.kpi.k-recdiego-valor::before{background:var(--verde-2)}\n.kpi.k-recdiego-qtd::before{background:var(--ouro)}\n.kpi .valor.positivo{color:var(--verde-3)}\n.kpi .valor.negativo{color:#B05C4A}\n.kpi.k-media-filtro::before{background:var(--verde-3)}\n.kpi.k-reembolso::before{background:#B05C4A}\n.kpis-ritmo{margin-top:14px}\n.kpi.k-dias::before{background:var(--verde-2)}\n.kpi.k-necessario::before{background:var(--bronze)}\n.kpi.k-media::before{background:var(--verde-3)}\n.kpi.k-ontem::before{background:var(--ouro)}\n.kpi .rotulo{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2)}\n.kpi .valor{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}\n.kpi .detalhe{font-size:12.5px;color:var(--tinta-2);margin-top:2px}\n\n.nota{font-size:12.5px;color:var(--tinta-2);margin-top:14px;line-height:1.5}\n.alerta-divergencia{\n  margin-top:14px;padding:12px 16px;border-radius:8px;\n  background:#FBF2E2;border:1px solid #E9CE9A;color:#6B4E1A;font-size:13px;line-height:1.5;\n}\n.alerta-divergencia strong{color:#4F3810}\n\n/* ── Cards ──────────────────────────── */\n.card{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:18px 20px;box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n@media(max-width:880px){.grid-2{grid-template-columns:1fr}}\n\n/* Barras estilo ripa (assinatura visual herdada do padrão Montagna Ads) */\n.slats{display:flex;flex-direction:column;gap:9px}\n.slat-row{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;padding:2px 6px;border-radius:6px}\n@media(max-width:560px){.slat-row{grid-template-columns:120px 1fr 78px}}\n.slat-nome{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.slat-trilho{background:var(--mdf);border-radius:4px;height:22px;position:relative}\n.slat-barra{\n  height:100%;border-radius:4px;min-width:2px;\n  background:\n    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 9px, rgba(0,0,0,.05) 9px 18px),\n    var(--cor,var(--verde-3));\n  border-right:2px solid rgba(0,0,0,.15);\n  transition:width .45s cubic-bezier(.2,.7,.3,1);\n}\n.slat-num{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;text-align:right;line-height:1.25}\n.rank-pos{display:inline-block;min-width:26px;font-weight:700;color:var(--tinta-2);font-variant-numeric:tabular-nums;font-size:12.5px}\n.slat-row.top1{background:linear-gradient(90deg, rgba(217,164,65,.16), transparent 75%)}\n.slat-row.top2{background:linear-gradient(90deg, rgba(155,150,138,.18), transparent 75%)}\n.slat-row.top3{background:linear-gradient(90deg, rgba(180,121,74,.16), transparent 75%)}\n.slat-row.top1 .rank-pos{color:var(--ouro)}\n.slat-row.top2 .rank-pos{color:var(--prata)}\n.slat-row.top3 .rank-pos{color:var(--bronze)}\n.vazio{padding:28px;text-align:center;color:var(--tinta-2);font-size:14px}\n\n/* Busca por nome dentro do ranking (filtra ou mostra todos) */\n.busca-nome-wrap{position:relative;margin-bottom:14px}\n.busca-nome{\n  width:100%;font:inherit;font-size:14px;color:var(--tinta);\n  background:var(--offwhite);border:1px solid var(--mdf-2);border-radius:8px;padding:9px 34px 9px 12px;\n}\n.busca-nome:focus-visible{outline:2px solid var(--verde-3);outline-offset:1px}\n.busca-nome-limpar{\n  position:absolute;right:6px;top:50%;transform:translateY(-50%);\n  background:none;border:none;color:var(--tinta-2);font-size:16px;cursor:pointer;padding:4px 8px;line-height:1;display:none;\n}\n.busca-nome-limpar.visivel{display:block}\n.busca-nome-info{font-size:12px;color:var(--tinta-2);margin-top:-8px;margin-bottom:10px}\n\n/* Gráfico de linha (variação diária) */\n#graficoLinhaWrap{position:relative}\n#graficoLinha{width:100%;height:auto;display:block}\n.tooltip{\n  position:absolute;pointer-events:none;background:var(--verde);color:var(--offwhite);\n  font-size:12.5px;padding:7px 11px;border-radius:7px;white-space:nowrap;\n  transform:translate(-50%,-115%);opacity:0;transition:opacity .12s;z-index:5;\n}\n.tooltip strong{color:#9AC98A}\n\nfooter{max-width:1180px;margin:0 auto;padding:0 20px 36px;font-size:12.5px;color:var(--tinta-2)}\n\n/* ── Estrutura de times / categorias ─────────────────── */\n.info-times{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:16px 20px;margin-top:20px;font-size:13px;color:var(--tinta-2);line-height:1.6;\n}\n.info-times strong{color:var(--tinta)}\n.legenda-categorias{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}\n.legenda-item{display:flex;align-items:center;gap:6px;font-size:12.5px}\n.legenda-dot{width:10px;height:10px;border-radius:50%;display:inline-block}\n.legenda-dot.senior{background:var(--ouro)}\n.legenda-dot.pleno{background:var(--prata)}\n.legenda-dot.junior{background:var(--bronze)}\n\n.time-badge{\n  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;\n  padding:2px 8px;border-radius:99px;color:var(--offwhite);white-space:nowrap;\n}\n.time-badge.tA{background:var(--verde-3)}\n.time-badge.tB{background:var(--verde-2)}\n.time-badge.t1{background:var(--bronze)}\n.time-badge.t2{background:#8A6C3D}\n.time-badge.t3{background:var(--ouro)}\n\n.cat-badge{\n  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;\n  padding:2px 8px;border-radius:99px;color:var(--tinta);white-space:nowrap;\n}\n.cat-badge.senior{background:#F3E1B8;color:#6B4E1A}\n.cat-badge.pleno{background:#E7E5DF;color:#4A473E}\n.cat-badge.junior{background:#E9D3BE;color:#5C3B1E}\n.cat-badge.sem-categoria{background:var(--mdf);color:var(--tinta-2)}\n\n.lider-tag{font-size:10.5px;color:var(--verde-2);font-weight:700}\n\n/* Cards de time */\n.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}\n@media(max-width:880px){.team-grid{grid-template-columns:1fr}}\n.team-grid + .team-grid{margin-top:16px}\n.team-grid-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);margin:20px 0 8px}\n.team-grid-label:first-child{margin-top:0}\n.team-card{\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:var(--raio);\n  padding:16px 18px;box-shadow:0 1px 0 rgba(38,58,33,.05);\n}\n.team-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}\n.team-card-nome{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}\n.fairy-icon{width:30px;height:30px;flex:none}\n.team-card-lider{font-size:12px;color:var(--tinta-2)}\n.team-card-nums{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}\n.team-card-total{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700}\n.team-card-meta{font-size:12.5px;color:var(--tinta-2)}\n.team-card-trilho{background:var(--mdf);border-radius:4px;height:10px;margin:8px 0 10px;overflow:hidden}\n.team-card-barra{height:100%;border-radius:4px;background:var(--verde-3);transition:width .45s cubic-bezier(.2,.7,.3,1)}\n.team-card-pct{font-size:12px;font-weight:600;color:var(--tinta-2);margin-bottom:10px}\n.team-card-membros{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--mdf);padding-top:8px}\n.team-card-membro{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:8px}\n.team-card-membro .m-nome{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.team-card-membro .m-valor{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}\n.team-card-membro .m-valor-nota{font-weight:400;font-size:10.5px;color:var(--tinta-2)}\n\n/* Sprinters: categoria de trabalho, não um time — visual deliberadamente diferente dos\n   .team-card acima (sem borda lateral de time, sem meta em R$, foco no % de no-show) */\n.metrica-card{\n  background:var(--mdf);border:1px dashed var(--prata);border-radius:var(--raio);\n  padding:20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;\n}\n.metrica-destaque-bloco{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:10px}\n.metrica-destaque-valor{font-size:40px;font-weight:700;color:var(--tinta);line-height:1;font-variant-numeric:tabular-nums}\n.metrica-destaque-rotulo{font-size:12.5px;color:var(--tinta-2)}\n.metrica-trilho{width:100%;max-width:360px;background:var(--mdf-2);border-radius:4px;height:8px;overflow:hidden}\n.metrica-barra{height:100%;background:var(--verde-3);border-radius:4px}\n.metrica-legenda{font-size:12px;color:var(--tinta-2);margin:6px 0 16px}\n.metrica-nums{display:flex;gap:32px;flex-wrap:wrap;justify-content:center}\n.metrica-num{display:flex;flex-direction:column;align-items:center}\n.metrica-num .n-valor{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}\n.metrica-num .n-rotulo{font-size:11.5px;color:var(--tinta-2)}\n.metrica-destaques{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}\n.metrica-destaque-chip{font-size:12px;color:var(--tinta-2);background:var(--branco);border:1px solid var(--mdf-2);border-radius:99px;padding:5px 12px}\n.destaque-tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;color:var(--offwhite);margin-right:4px}\n.destaque-tag.melhor{background:var(--verde-3)}\n.destaque-tag.pior{background:#B05C4A}\n.metrica-toggle{\n  display:flex;align-items:center;gap:6px;margin:16px auto 0;padding:7px 16px;\n  background:var(--branco);border:1px solid var(--mdf-2);border-radius:99px;\n  font-size:12.5px;font-weight:600;color:var(--tinta-2);cursor:pointer;\n}\n.metrica-toggle:hover{background:var(--mdf)}\n.metrica-toggle-seta{display:inline-block;transition:transform .2s ease;font-size:10px}\n.metrica-toggle[aria-expanded=\"true\"] .metrica-toggle-seta{transform:rotate(90deg)}\n.metrica-dia-semana{font-weight:400;color:var(--tinta-2);font-size:11.5px}\n\n/* Tabela diária: Dia / Agendadas / Realizadas / No-show (com escala de cor) */\n.metrica-table{display:flex;flex-direction:column;border:1px solid var(--mdf-2);border-radius:var(--raio);overflow:hidden}\n.metrica-table-head, .metrica-table-row{\n  display:grid;grid-template-columns:84px 1fr 1fr 110px;gap:8px;align-items:center;padding:8px 14px;\n}\n@media(max-width:560px){ .metrica-table-head, .metrica-table-row{grid-template-columns:62px 1fr 1fr 86px;gap:4px;padding:7px 10px} }\n.metrica-table-head{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2);background:var(--mdf)}\n.metrica-table-head span:not(:first-child), .metrica-table-row span:not(:first-child){text-align:right}\n.metrica-table-row{font-size:13px;border-top:1px solid var(--mdf-2);font-variant-numeric:tabular-nums}\n.metrica-table-row.sem-reuniao{color:var(--tinta-2)}\n.metrica-table-row .dia-nome{text-align:left;display:flex;align-items:center;gap:6px;font-weight:500}\n.metrica-table-row .metrica-pill{\n  display:inline-block;justify-self:end;padding:3px 10px;border-radius:99px;font-weight:700;font-size:12.5px;\n}\n\n/* Atingimento individual */\n.categoria-heading{\n  font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2);\n  margin:16px 0 8px;display:flex;align-items:center;gap:8px;\n}\n.categoria-heading:first-child{margin-top:0}\n.individual-list{display:flex;flex-direction:column;gap:10px}\n.individual-row{padding:2px 2px}\n.indi s=\"detalhe\" id=\"kRecDiegoValorDet\"><\/div><\/div>\n      <div class=\"kpi k-recdiego-qtd\"><div class=\"rotulo\">Qtd. de recuperações<\/div><div class=\"valor\" id=\"kRecDiegoQtd\">–<\/div><div class=\"detalhe\" id=\"kRecDiegoQtdDet\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Gráfico de linha: variação diária do mês corrente -->\n  <section>\n    <div class=\"sec-head\"><h2>Variação diária de vendas<\/h2><span class=\"sub\" id=\"graficoLinhaSub\">evolução dia a dia do mês corrente<\/span><\/div>\n    <div class=\"card\">\n      <div id=\"graficoLinhaWrap\">\n        <svg id=\"graficoLinha\" viewBox=\"0 0 920 260\" role=\"img\" aria-label=\"Gráfico de variação diária de vendas\"><\/svg>\n        <div class=\"tooltip\" id=\"tipGraficoLinha\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Sprinters — categoria de trabalho (NÃO é um time de vendas), visual próprio para não confundir com os cards de time lá em cima -->\n  <section id=\"secSprinters\" style=\"display:none\">\n    <div class=\"sec-head\"><h2>Sprinters — <span id=\"sprintersNomes\"><\/span><\/h2><span class=\"sub\">categoria de trabalho, não um time de vendas — as vendas de quem está aqui seguem valendo no Ranking de SDRs e no total geral; aqui o que se acompanha é o no-show das reuniões<\/span><\/div>\n    <div class=\"metrica-card\">\n      <div class=\"metrica-destaque-bloco\">\n        <span class=\"metrica-destaque-valor\" id=\"sprintersPctNoShow\">–<\/span>\n        <span class=\"metrica-destaque-rotulo\">no-show · <span id=\"sprintersPeriodoLabel\"><\/span><\/span>\n      <\/div>\n      <div class=\"metrica-trilho\"><div class=\"metrica-barra\" id=\"sprintersBarra\"><\/div><\/div>\n      <div class=\"metrica-legenda\" id=\"sprintersPctComp\"><\/div>\n      <div class=\"metrica-nums\">\n        <div class=\"metrica-num\"><span class=\"n-valor\" id=\"sprintersAgendadas\">–<\/span><span class=\"n-rotulo\">reuniões agendadas<\/span><\/div>\n        <div class=\"metrica-num\"><span class=\"n-valor\" id=\"sprintersAconteceram\">–<\/span><span class=\"n-rotulo\">reuniões aconteceram<\/span><\/div>\n      <\/div>\n      <div class=\"metrica-destaques\">\n        <div class=\"metrica-destaque-chip\" id=\"sprintersMediaAgendadas\"><\/div>\n        <div class=\"metrica-destaque-chip\" id=\"sprintersMediaAconteceram\"><\/div>\n      <\/div>\n    <\/div>\n    <button type=\"button\" class=\"metrica-toggle\" id=\"sprintersToggle\" aria-expanded=\"false\">\n      <span id=\"sprintersToggleLabel\">Ver no-show por dia<\/span> <span class=\"metrica-toggle-seta\" id=\"sprintersToggleSeta\">▸<\/span>\n    <\/button>\n    <div class=\"metrica-table\" id=\"sprintersDias\" style=\"display:none\">\n      <div class=\"metrica-table-head\">\n        <span>Dia<\/span><span>Agendadas<\/span><span>Realizadas<\/span><span>No-show<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ROAS de Mídia -->\n  <section id=\"secRoas\" style=\"display:none\">\n    <div class=\"sec-head\"><h2>ROAS de Mídia<\/h2><span class=\"sub\">retorno sobre o investimento em mídia — vendas do dia ÷ investimento do dia<\/span><\/div>\n    <div class=\"metrica-card\">\n      <div class=\"metrica-destaque-bloco\">\n        <span class=\"metrica-destaque-valor\" id=\"roasValor\">–<\/span>\n        <span class=\"metrica-destaque-rotulo\">ROAS · <span id=\"roasPeriodoLabel\"><\/span><\/span>\n      <\/div>\n      <div class=\"metrica-nums\">\n        <div class=\"metrica-num\" id=\"roasInvestimento\"><\/div>\n        <div class=\"metrica-num\" id=\"roasVendas\"><\/div>\n      <\/div>\n    <\/div>\n    <button type=\"button\" class=\"metrica-toggle\" id=\"roasToggle\" aria-expanded=\"false\">\n      <span id=\"roasToggleLabel\">Ver ROAS por dia<\/span> <span class=\"metrica-toggle-seta\" id=\"roasToggleSeta\">▸<\/span>\n    <\/button>\n    <div class=\"metrica-table\" id=\"roasDias\" style=\"display:none\">\n      <div class=\"metrica-table-head\">\n        <span>Dia<\/span><span>Investido<\/span><span>Vendas<\/span><span>ROAS<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Contatos GHL -->\n  <section id=\"secGhl\" style=\"display:none\">\n    <div class=\"sec-head\"><h2>Contatos GHL<\/h2><span class=\"sub\">novos contatos no CRM e quantos entraram no pipeline<\/span><\/div>\n    <div class=\"metrica-card\">\n      <div class=\"metrica-destaque-bloco\">\n        <span class=\"metrica-destaque-valor\" id=\"ghlConversao\">–<\/span>\n        <span class=\"metrica-destaque-rotulo\">conversão para pipeline · <span id=\"ghlPeriodoLabel\"><\/span><\/span>\n      <\/div>\n      <div class=\"metrica-nums\">\n        <div class=\"metrica-num\" id=\"ghlContatosNum\"><\/div>\n        <div class=\"metrica-num\" id=\"ghlPipelineNum\"><\/div>\n      <\/div>\n    <\/div>\n    <button type=\"button\" class=\"metrica-toggle\" id=\"ghlToggle\" aria-expanded=\"false\">\n      <span id=\"ghlToggleLabel\">Ver conversão por dia<\/span> <span class=\"metrica-toggle-seta\" id=\"ghlToggleSeta\">▸<\/span>\n    <\/button>\n    <div class=\"metrica-table\" id=\"ghlDias\" style=\"display:none\">\n      <div class=\"metrica-table-head\">\n        <span>Dia<\/span><span>Contatos<\/span><span>Pipeline<\/span><span>Conversão<\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Reembolsos -->\n  <section>\n    <div class=\"sec-head\"><h2>Reembolsos<\/h2><span class=\"sub\" id=\"reembolsosSub\">pedidos pagos e cancelados em até 7 dias — não entram no total vendido, mas contam aqui por closer/SDR<\/span><\/div>\n    <div class=\"grid-2\">\n      <div class=\"card\">\n        <div class=\"sec-head\" style=\"margin-bottom:8px\"><h2 style=\"font-size:15px\">Por Closer<\/h2><\/div>\n        <div class=\"slats\" id=\"gReembolsoCloser\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"sec-head\" style=\"margin-bottom:8px\"><h2 style=\"font-size:15px\">Por SDR<\/h2><\/div>\n        <div class=\"slats\" id=\"gReembolsoSdr\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- Low Ticket -->\n  <section>\n    <div class=\"sec-head\"><h2>Vendas Low Ticket<\/h2><span class=\"sub\">produto sem closer/SDR atribuído — o valor já soma ao Total Vendido lá em cima; aqui é só o detalhamento<\/span><\/div>\n    <div class=\"kpis\">\n      <div class=\"kpi k-lowticket-valor\"><div class=\"rotulo\">Valor Low Ticket<\/div><div class=\"valor\" id=\"kLowTicketValor\">–<\/div><div class=\"detalhe\" id=\"kLowTicketValorDet\"><\/div><\/div>\n      <div class=\"kpi k-lowticket-qtd\"><div class=\"rotulo\">Qtd. de vendas<\/div><div class=\"valor\" id=\"kLowTicketQtd\">–<\/div><div class=\"detalhe\" id=\"kLowTicketQtdDet\"><\/div><\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"nota\">\n    Nota: a meta é única e mensal para a operação (mesmo valor usado para Closers e SDRs). O total vendido é calculado a partir das\n    vendas concretizadas pelos closers; o total de SDRs deve ser igual, pois é a mesma venda contabilizada duas vezes — uma para o\n    closer que fechou, outra para o SDR que qualificou e encaminhou o lead.\n  <\/div>\n  <div class=\"alerta-divergencia\" id=\"alertaDivergencia\" style=\"display:none\"><\/div>\n\n  <!-- Estrutura de times -->\n  <div class=\"info-times\">\n    <strong>Estrutura comercial — setembro/26:<\/strong> Closers em <strong>Time A — \"Galáticos\"<\/strong> (Portuga · líder, Paulo, Túlio, Luigi) e <strong>Time B<\/strong> (Edu · líder, Larissa, Rodrigo, Misael). SDRs em <strong>Time 1 — \"Fantásticos Leads\"<\/strong> (Rafael · líder, Beatriz, Vitor, Carioca, Alvaro) e <strong>Time 2 — \"Clube das Winx\"<\/strong> (Michelly · líder, Leandro, Gustavo, Iasmin). Alvaro entrou no Time 1 sem categoria (Júnior/Pleno/Sênior) e, portanto, sem meta individual — mas seu resultado conta normalmente para o total do Time 1 e para o somatório geral de SDR.\n    <br><br>\n    <strong>A partir de outubro/26:<\/strong> Túlio e Misael saíram dos times de Closers — seus resultados deixam de contar para o total de Time A/B, mas continuam no Ranking de Closers e no somatório geral. Rafael e Leandro saíram dos times de SDR, com o mesmo tratamento (ranking e somatório geral, fora da soma por time). Vitor migrou para o <strong>Time 2 — \"Clube das Winx\"<\/strong>, que passa a ter só Iasmin e Vitor. O <strong>Time 1 — \"Fantásticos Leads\"<\/strong> passa a ter só Carioca, Beatriz e Alvaro. Michelly e Gustavo formam o novo <strong>Time 3 — \"Sprinters\"<\/strong>: não têm meta em R$ nem somatório de time (suas vendas contam no Ranking de SDRs e no somatório geral, mas não no total de nenhum time) — em vez disso, são acompanhados pela taxa de no-show das reuniões agendadas.\n    <br><br>\n    Cada pessoa também tem uma categoria com meta individual mensal — os valores de SDR e Closer não se somam entre si (são complementares: a mesma venda é contabilizada uma vez do lado do closer e uma vez do lado do SDR).\n    <div class=\"legenda-categorias\">\n      <span class=\"legenda-item\"><span class=\"legenda-dot senior\"><\/span>Sênior — meta R$ 85.000/mês<\/span>\n      <span class=\"legenda-item\"><span class=\"legenda-dot pleno\"><\/span>Pleno — meta R$ 65.000/mês<\/span>\n      <span class=\"legenda-item\"><span class=\"legenda-dot junior\"><\/span>Júnior — meta R$ 50.000/mês<\/span>\n    <\/div>\n  <\/div>\n\n<\/main>\n\n<footer>\n  Fonte: planilha comercial HOD (Portal do Seller / CRM) · Junho–Agosto de 2026 · Dashboard produzido por Montagna Ads.\n<\/footer>\n\n<script>\nconst DADOS = {\"meses\": [\"Janeiro/26\", \"Fevereiro/26\", \"Março/26\", \"Abril/26\", \"Maio/26\", \"Junho/26\", \"Julho/26\", \"Agosto/26\", \"Setembro/26\", \"Outubro/26\"], \"metas\": [111212.79, 137069.2, 176472.66, 261172.05, 340000, 400000, 450000, 520000, 500000.0, 400000], \"closers\": [\"ALVARO\", \"AUTOMÁTICO\", \"EDUARDO\", \"GRAZI\", \"KARINA\", \"LARISSA\", \"LEANDRO PT\", \"LUCCAS\", \"LUIGI\", \"MARCOS\", \"MARRAZZO\", \"MISAEL\", \"NATHAN\", \"PAULO\", \"RAFAEL\", \"RODRIGO\", >1) st.meses.delete(i); // sempre ao menos 1 mês selecionado\n      } else {\n        st.meses.add(i);\n      }\n      b.classList.toggle('ativo', st.meses.has(i));\n      atualizaLimitesDias();\n      render();\n    });\n    cont.appendChild(b);\n  });\n}\n\n$('limpar').addEventListener('click', ()=>{\n  st.meses = new Set(DADOS.meses.map((_,i)=>i));\n  document.querySelectorAll('.chip-mes').forEach(c=>c.classList.add('ativo'));\n  atualizaLimitesDias();\n  render();\n});\n\n// ── Filtro de dias: recolhido por padrão, só aparece quando a pessoa clica em\n// \"Filtrar por dia\". Usa inputs de calendário nativos, limitados ao mês de\n// referência (o primeiro mês marcado no filtro de período). ──\nfunction boundsMesReferenciaSelecionado(){\n  const idx = [...st.meses].sort((a,b)=>a-b)[0];\n  const {ano, mes} = parseMesLabel(DADOS.meses[idx]);\n  return { ano, mes, diasNoMes: ultimoDiaDoMes(ano, mes) };\n}\nfunction isoDate(ano,mes,dia){ return `${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`; }\n\nfunction montaFiltroDias(){\n  const inputIni = $('diaIniCal'), inputFim = $('diaFimCal');\n  const botaoToggle = $('toggleFiltroDias'), painel = $('painelDias'), botaoLimpar = $('limparDias');\n\n  function atualizaLimites(){\n    const { ano, mes, diasNoMes } = boundsMesReferenciaSelecionado();\n    const min = isoDate(ano,mes,1), max = isoDate(ano,mes,diasNoMes);\n    inputIni.min = min; inputIni.max = max;\n    inputFim.min = min; inputFim.max = max;\n    inputIni.value = isoDate(ano, mes, Math.min(st.diaIni, diasNoMes));\n    inputFim.value = isoDate(ano, mes, Math.min(st.diaFim, diasNoMes));\n  }\n  atualizaLimitesDias = atualizaLimites; // exposto para montaToggles/limpar atualizarem o calendário\n\n  function atualizaRotuloToggle(){\n    const filtrado = !(st.diaIni===1 && st.diaFim===31);\n    botaoToggle.classList.toggle('ativo', filtrado);\n    botaoToggle.textContent = filtrado ? `📅 Dias ${st.diaIni}–${st.diaFim}` : '📅 Filtrar por dia';\n  }\n  atualizaRotuloToggleFn = atualizaRotuloToggle;\n\n  botaoToggle.addEventListener('click', ()=>{\n    const abrindo = painel.hidden;\n    painel.hidden = !painel.hidden;\n    if(abrindo) atualizaLimites();\n  });\n\n  inputIni.addEventListener('change', ()=>{\n    if(!inputIni.value) return;\n    st.diaIni = new Date(inputIni.value+'T00:00:00').getDate();\n    if(st.diaIni>st.diaFim){ st.diaFim = st.diaIni; }\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n  inputFim.addEventListener('change', ()=>{\n    if(!inputFim.value) return;\n    st.diaFim = new Date(inputFim.value+'T00:00:00').getDate();\n    if(st.diaFim<st.diaIni){ st.diaIni = st.diaFim; }\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n  botaoLimpar.addEventListener('click', ()=>{\n    st.diaIni = 1; st.diaFim = 31;\n    atualizaLimites();\n    atualizaRotuloToggle();\n    render();\n  });\n\n  atualizaLimites();\n  atualizaRotuloToggle();\n}\nlet atualizaLimitesDias = ()=>{};\nlet atualizaRotuloToggleFn = ()=>{};\n\n// ── Soma o valor de uma pessoa dentro do recorte atual (meses + dias) ──\nfunction totalPessoa(nome, mapaDiario){\n  const porMes = mapaDiario[nome];\n  if(!porMes) return 0;\n  let t=0;\n  st.meses.forEach(idx=>{\n    const dias = porMes[idx];\n    if(!dias) return;\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim) t += dias[diaStr];\n    }\n  });\n  return t;\n}\n\n// ── Soma o valor de uma equipe inteira dentro do recorte atual ──\nfunction totalEquipe(lista, mapaDiario){\n  return lista.reduce((s,nome)=> s + totalPessoa(nome, mapaDiario), 0);\n}\n\n// ── Vendas \"low ticket\": produto sem closer/SDR atribuído. Soma ao total vendido,\n// mas é rastreado à parte (valor + quantidade) para o card secundário de Low Ticket. ──\nfunction totalLowTicketFiltrado(){\n  let valor=0, qtd=0;\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.diarioLowTicket||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        valor += dias[diaStr].v;\n        qtd += dias[diaStr].n;\n      }\n    }\n  });\n  return { valor, qtd };\n}\nfunction totalLowTicketAteDia(idx, diaFim){\n  const dias = (DADOS.diarioLowTicket||[])[idx] || {};\n  let v=0;\n  for(const diaStr in dias){ if(+diaStr>=1 && +diaStr<=diaFim) v += dias[diaStr].v; }\n  return v;\n}\n\n// ── Recuperação de cobranças (Diego): contabiliza no valor geral, mas não entra\n// no somatório de closers/SDRs. Rastreado à parte (valor + quantidade), como o Low Ticket. ──\nfunction totalRecDiegoFiltrado(){\n  let valor=0, qtd=0;\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.diarioRecuperacaoDiego||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        valor += dias[diaStr].v;\n        qtd += dias[diaStr].n;\n      }\n    }\n  });\n  return { valor, qtd };\n}\nfunction totalRecDiegoAteDia(idx, diaFim){\n  const dias = (DADOS.diarioRecuperacaoDiego||[])[idx] || {};\n  let v=0;\n  for(const diaStr in dias){ if(+diaStr>=1 && +diaStr<=diaFim) v += dias[diaStr].v; }\n  return v;\n}\n\n// ── Meta do período: sempre o mês inteiro, não é afetada pelo filtro de dias ──\nfunction metaPeriodo(){\n  let t=0;\n  st.meses.forEach(i=> t += DADOS.metas[i]);\n  return t;\n}\n\n// ── Estrutura de times — existem duas \"eras\": Setembro/26 (estrutura original) e\n// Outubro/26 em diante (Túlio/Misael/Rafael/Leandro saem dos times; SDRs ganham o\n// time \"Sprinters\" para Michelly/Gustavo, rastreado por no-show em vez de meta em R$).\n// Chaves batem com DADOS.closers / DADOS.sdrs; \"apelido\" é o nome usado nas conversas do time.\n// Quem não está em nenhum PESSOAS_*/TIMES_* da era vigente simplesmente não aparece nos\n// cards de \"Desempenho por Time\" nem em \"Atingimento Individual\" — mas seus resultados\n// continuam contando normalmente no Ranking de Closers/SDRs e no somatório total.\nconst ERA_SETEMBRO = {\n  pessoasCloser: {\n    'LEANDRO PT': { apelido:'Portuga', time:'A', categoria:'senior', meta:85000, lider:true },\n    'PAULO':      { apelido:'Paulo',   time:'A', categoria:'junior', meta:50000 },\n    'TÚLIO':      { apelido:'Túlio',   time:'A', categoria:'pleno',  meta:65000 },\n    'LUIGI':      { apelido:'Luigi',   time:'A', categoria:'junior', meta:50000 },\n    'EDUARDO':    { apelido:'Edu',     time:'B', categoria:'senior', meta:85000, lider:true },\n    'LARISSA':    { apelido:'Larissa', time:'B', categoria:'pleno',  meta:65000 },\n    'RODRIGO':    { apelido:'Rodrigo', time:'B', categoria:'junior', meta:50000 },\n    'MISAEL':     { apelido:'Misael',  time:'B', categoria:'junior', meta:50000 },\n  },\n  pessoasSdr: {\n    'RAFAEL':      { apelido:'Rafael',   time:'1', categoria:'senior', meta:85000, lider:true },\n    'BEATRIZ':     { apelido:'Beatriz',  time:'1', categoria:'pleno',  meta:65000 },\n    'VITOR':       { apelido:'Vitor',    time:'1', categoria:'junior', meta:50000 },\n    'CARIOCA':     { apelido:'Carioca',  time:'1', categoria:'junior', meta:50000 },\n    'ALVARO':      { apelido:'Alvaro',   time:'1' },\n    'MICHELLY':    { apelido:'Michelly', time:'2', categoria:'senior', meta:85000, lider:true },\n    'LEANDRO B.':  { apelido:'Leandro',  time:'2', categoria:'pleno',  meta:65000 },\n    'GUSTAVO':     { apelido:'Gustavo',  time:'2', categoria:'junior', meta:50000 },\n    'IASMIN':      { apelido:'Iasmin',   time:'2', categoria:'junior', meta:50000 },\n  },\n  timesCloser: {\n    A: { nome:'Galáticos', sigla:'TIME A', badge:'tA', icone:'brasao', membros:['LEANDRO PT','PAULO','TÚLIO','LUIGI'] },\n    B: { nome:'Time B', sigla:'TIME B', badge:'tB', membros:['EDUARDO','LARISSA','RODRIGO','MISAEL'] },\n  },\n  timesSdr: {\n    '1': { nome:'Fantásticos Leads', sigla:'TIME 1', badge:'t1', icone:'badge4', membros:['RAFAEL','BEATRIZ','VITOR','CARIOCA','ALVARO'] },\n    '2': { nome:'Clube das Winx', sigla:'TIME 2', badge:'t2', icone:'fada', membros:['MICHELLY','LEANDRO B.','GUSTAVO','IASMIN'] },\n  },\n  sprinters: null,\n};\nconst ERA_OUTUBRO = {\n  pessoasCloser: {\n    // TÚLIO e MISAEL saíram dos times a partir de outubro/26 (resultados seguem no ranking/total)\n    'LEANDRO PT': { apelido:'Portuga', time:'A', categoria:'senior', meta:85000, lider:true },\n    'PAULO':      { apelido:'Paulo',   time:'A', categoria:'junior', meta:50000 },\n    'LUIGI':      { apelido:'Luigi',   time:'A', categoria:'junior', meta:50000 },\n    'EDUARDO':    { apelido:'Edu',     time:'B', categoria:'senior', meta:85000, lider:true },\n    'LARISSA':    { apelido:'Larissa', time:'B', categoria:'pleno',  meta:65000 },\n    'RODRIGO':    { apelido:'Rodrigo', time:'B', categoria:'junior', meta:50000 },\n    // Alvaro entrou como closer júnior sem time — segue a meta/categoria individual,\n    // mas não soma no total de nenhum time (mesmo tratamento do Túlio/Misael).\n    'ALVARO':     { apelido:'Alvaro',  categoria:'junior', meta:50000 },\n  },\n  pessoasSdr: {\n    // RAFAEL e LEANDRO B. saíram dos times (resultados seguem no ranking/total).\n    // VITOR migrou para o Time 2 (Clube das Winx). MICHELLY/GUSTAVO viraram o time \"Sprinters\".\n    'CARIOCA':     { apelido:'Carioca',  time:'1', categoria:'junior', meta:50000 },\n    'BEATRIZ':     { apelido:'Beatriz',  time:'1', categoria:'pleno',  meta:65000 },\n    'ALVARO':      { apelido:'Alvaro',   time:'1' },\n    'IASMIN':      { apelido:'Iasmin',   time:'2', categoria:'junior', meta:50000 },\n    'VITOR':       { apelido:'Vitor',    time:'2', categoria:'junior', meta:50000 },\n    // Sprinters não é um time de vendas, é uma categoria de trabalho à parte — por isso não\n    // têm categoria/meta (não entram em \"Atingimento Individual\") nem aparecem nos cards de\n    // \"Desempenho por Time\" (são exibidos em seção própria, com o indicador de no-show).\n    'MICHELLY':    { apelido:'Michelly' },\n    'GUSTAVO':     { apelido:'Gustavo' },\n  },\n  timesCloser: {\n    A: { nome:'Galáticos', sigla:'TIME A', badge:'tA', icone:'brasao', membros:['LEANDRO PT','PAULO','LUIGI'] },\n    B: { nome:'Time B', sigla:'TIME B', badge:'tB', membros:['EDUARDO','LARISSA','RODRIGO'] },\n  },\n  timesSdr: {\n    '1': { nome:'Fantásticos Leads', sigla:'TIME 1', badge:'t1', icone:'badge4', membros:['CARIOCA','BEATRIZ','ALVARO'] },\n    '2': { nome:'Clube das Winx', sigla:'TIME 2', badge:'t2', icone:'fada', membros:['IASMIN','VITOR'] },\n  },\n  // Sprinters NÃO é um time de vendas — é uma categoria de trabalho à parte, por isso fica\n  // fora de timesSdr/\"Desempenho por Time\" e ganha seção própria, com o indicador de no-show.\n  // As vendas de Michelly/Gustavo continuam valendo no Ranking de SDRs e no total geral.\n  sprinters: { membros:['MICHELLY','GUSTAVO'] },\n};\n// ── Reuniões/no-show dos Sprinters, diarizado (DADOS.sprintersReunioes[idxMes][dia] = {ag, ac}) ──\n// Segue o mesmo recorte de meses/dias do restante do dashboard (st.meses, st.diaIni/diaFim).\nfunction sprintersDiasFiltrado(){\n  const linhas = [];\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.sprintersReunioes||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        const { ag, ac } = dias[diaStr];\n        linhas.push({ idx, dia, ag, ac });\n      }\n    }\n  });\n  linhas.sort((a,b)=> a.idx-b.idx || a.dia-b.dia);\n  return linhas;\n}\nfunction sprintersLabelDia(idx, dia){\n  const { mes } = parseMesLabel(DADOS.meses[idx]);\n  return `${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')}`;\n}\nconst DIAS_SEMANA_ABREV = ['dom','seg','ter','qua','qui','sex','sáb'];\nfunction sprintersDiaSemana(idx, dia){\n  const { ano, mes } = parseMesLabel(DADOS.meses[idx]);\n  return DIAS_SEMANA_ABREV[new Date(ano, mes-1, dia).getDay()];\n}\n// Escala de cor relativa ao próprio período exibido (reaproveitada por no-show, ROAS e\n// conversão GHL). maiorEhMelhor=false → menor valor fica verde (ex.: no-show). true → maior\n// valor fica verde (ex.: ROAS, taxa de conversão). min/max calculados só entre dias com dado.\nfunction escalaCor(valor, min, max, maiorEhMelhor){\n  if(max<=min) return { bg:'var(--mdf)', fg:'var(--tinta-2)' };\n  let t = Math.min(1, Math.max(0, (valor-min)/(max-min)));\n  if(!maiorEhMelhor) t = 1-t;\n  const hue = 12 + t*88; // 12=vermelho(pior) → 100=verde(melhor)\n  return { bg:`hsl(${hue.toFixed(0)},55%,88%)`, fg:`hsl(${hue.toFixed(0)},50%,26%)` };\n}\n\nfunction idxOutubro(){ return DADOS.meses.indexOf('Outubro/26'); }\n// ── Retorna a estrutura de times vigente para um índice de mês (ou para o mês em foco atual) ──\nfunction estruturaParaIdx(idx){\n  const io = idxOutubro();\n  return (io>=0 && idx>=io) ? ERA_OUTUBRO : ERA_SETEMBRO;\n}\nfunction estruturaAtual(){\n  const idx = mesFocoAtual();\n  return estruturaParaIdx(idx>=0 ? idx : (DADOS.meses.length-1));\n}\n\nconst CATEGORIA_LABEL = { senior:'Sênior', pleno:'Pleno', junior:'Júnior' };\nconst CATEGORIA_ORDEM = ['senior','pleno','junior'];\n\n// ── Soma o total de vendas (lado closer) de um mês específico, do dia 1 até um dia-limite ──\n// Usado para comparar a evolução \"mês corrente até hoje\" vs \"mês anterior até o mesmo dia\".\nfunction totalClosersAteDia(idx, diaFim){\n  if(idx < 0 || !DADOS.meses[idx]) return 0;\n  const totClosers = DADOS.closers.reduce((s,n)=>{\n    const dias = (DADOS.diarioCloser[n]||[])[idx] || {};\n    let sub=0;\n    for(const d in dias){ if(+d>=1 && +d<=diaFim) sub+=dias[d]; }\n    return s+sub;\n  },0);\n  return totClosers + totalLowTicketAteDia(idx, diaFim) + totalRecDiegoAteDia(idx, diaFim);\n}\n\n// ── Quantidade de dias \"decorridos\" (já ocorridos) dentro de um mês, considerando\n// a data de atualização para o mês corrente e o mês completo para meses já fechados ──\nfunction diasElapsedNoMes(idx){\n  const {ano, mes} = parseMesLabel(DADOS.meses[idx]);\n  const diasNoMes = ultimoDiaDoMes(ano, mes);\n  const inputVal = $('dataAtualizacao').value;\n  if(inputVal){\n    const [aY, aM, aD] = inputVal.split('-').map(Number);\n    if(ano===aY && mes===aM) return Math.min(Math.max(aD,1), diasNoMes); // mês corrente: só até hoje\n    if(ano>aY || (ano===aY && mes>aM)) return 0; // mês ainda no futuro\n  }\n  return diasNoMes; // mês já fechado (passado): conta inteiro\n}\n\n// ── Quantidade de dias efetivamente contados no filtro atual (para a média diária) —\n// conta dias corridos (mesmo sem venda), nunca dias futuros que ainda não aconteceram ──\nfunction diasNoFiltro(){\n  let n=0;\n  st.meses.forEach(idx=>{\n    const elapsed = diasElapsedNoMes(idx);\n    const ini = Math.max(st.diaIni, 1);\n    const fim = Math.min(st.diaFim, elapsed);\n    if(fim>=ini) n += (fim-ini+1);\n  });\n  return n;\n}\n\nfunction rankingEquipe(lista, mapaDiario){\n  return lista.map(nome=>[nome, totalPessoa(nome, mapaDiario)]).sort((a,b)=>b[1]-a[1]);\n}\n\n// ── Ritmo do mês em foco (dias restantes / necessário por dia) ──\n// O \"mês em foco\" é o mais recente entre os marcados no filtro de período —\n// ex.: se só Julho está marcado, o ritmo é calculado sobre Julho (mês fechado).\n// A \"data de atualização\" continua sendo só a referência do que é \"hoje\".\nfunction mesFocoAtual(){\n  if(!st.meses.size) return -1;\n  return [...st.meses].sort((a,b)=>b-a)[0];\n}\nfunction hojeInfo(){\n  const inputVal = $('dataAtualizacao').value;\n  if(!inputVal) return null;\n  const [ano, mes, dia] = inputVal.split('-').map(Number);\n  return { ano, mes, dia };\n}\nfunction compararMes(anoA,mesA, anoB,mesB){\n  if(anoA!==anoB) return anoA-anoB;\n  return mesA-mesB;\n}\n\nfunction calcRitmo(){\n  const hoje = hojeInfo();\n  if(!hoje) return null;\n  const idx = mesFocoAtual();\n  if(idx === -1) return null;\n\n  const { ano, mes } = parseMesLabel(DADOS.meses[idx]);\n  const diasNoMes = ultimoDiaDoMes(ano, mes);\n  const cmp = compararMes(ano, mes, hoje.ano, hoje.mes);\n\n  const totalMes = Object.values(DADOS.diarioTotal[idx] || {}).reduce((a,b)=>a+b,0);\n  const metaMes = DADOS.metas[idx];\n  const faltaMes = metaMes - totalMes;\n\n  if(cmp === 0){\n    // mês corrente: ainda em andamento\n    const diasDecorridos = Math.min(Math.max(hoje.dia,1), diasNoMes);\n    const diasRestantes = diasNoMes - diasDecorridos + 1; // inclusive hoje\n    const necessarioPorDia = faltaMes > 0.01 ? faltaMes/diasRestantes : 0;\n    return { status:'corrente', idx, mesLabel:DADOS.meses[idx], diasNoMes, diasDecorridos, diasRestantes, totalMes, metaMes, faltaMes, necessarioPorDia };\n  }\n  if(cmp < 0){\n    // mês fechado: já passou por completo\n    return { status:'fechado', idx, mesLabel:DADOS.meses[idx], diasNoMes, totalMes, metaMes, faltaMes };\n  }\n  // mês futuro (fora dos dados ainda)\n  return { status:'futuro', idx, mesLabel:DADOS.meses[idx], diasNoMes, totalMes, metaMes, faltaMes };\n}\n\n// ── Quanto fizemos ontem (mês corrente) / Último dia registrado (mês fechado) ──\nfunction calcOntem(){\n  const r = calcRitmo();\n  if(!r) return null;\n\n  if(r.status === 'corrente'){\n    const hoje = hojeInfo();\n    const dataRef = new Date(hoje.ano, hoje.mes-1, hoje.dia);\n    const ontem = new Date(dataRef);\n    ontem.setDate(ontem.getDate()-1);\n    const anoOntem = ontem.getFullYear(), mesOntem = ontem.getMonth()+1, diaOntem = ontem.getDate();\n\n    const idx = DADOS.meses.findIndex(label=>{\n      const p = parseMesLabel(label);\n      return p.ano===anoOntem && p.mes===mesOntem;\n    });\n    if(idx === -1) return { semReferencia:true, status:'corrente' };\n\n    const valor = DADOS.diarioTotal[idx] ? DADOS.diarioTotal[idx][String(diaOntem)] : undefined;\n    if(valor === undefined) return { semDado:true, dia:diaOntem, mesLabel: DADOS.meses[idx], status:'corrente' };\n\n    return { idx, mesLabel: DADOS.meses[idx], dia: diaOntem, valor, status:'corrente' };\n  }\n\n  if(r.status === 'fechado'){\n    // Mês já fechado: mostra o último dia com venda registrada nele, não \"ontem\"\n    const dias = Object.keys(DADOS.diarioTotal[r.idx] || {}).map(Number);\n    if(!dias.length) return { semDado:true, mesLabel:r.mesLabel, status:'fechado' };\n    const ultimoDia = Math.max(...dias);\n    const valor = DADOS.diarioTotal[r.idx][String(ultimoDia)];\n    return { idx:r.idx, mesLabel:r.mesLabel, dia:ultimoDia, valor, status:'fechado' };\n  }\n\n  return { semReferencia:true, status:r.status };\n}\n\n// ── Slats (barras de ranking com posição) — cada linha guarda o nome em\n// minúsculo em data-nome para permitir filtrar por busca sem recalcular posições ──\nfunction slats(el, pares, formatador){\n  el.innerHTML='';\n  formatador = formatador || fmtMoeda;\n  if(!pares.length || pares.every(p=>p[1]===0)){ el.innerHTML='<div class=\"vazio\">Sem dados para o período selecionado.<\/div>'; return; }\n  const max = pares[0][1] || 1;\n  pares.forEach(([nome,v],i)=>{\n    const row=document.createElement('div');\n    row.className='slat-row'+(i<3?' top'+(i+1):'');\n    row.dataset.nome = normaliza(nome);\n    row.innerHTML = `<div class=\"slat-nome\" title=\"${nome}\"><span class=\"rank-pos\">${i+1}º<\/span> ${nome}<\/div>\n      <div class=\"slat-trilho\"><div class=\"slat-barra\" style=\"width:${(v/max*100).toFixed(1)}%\"><\/div><\/div>\n      <div class=\"slat-num\">${formatador(v)}<\/div>`;\n    el.appendChild(row);\n  });\n}\n\n// Ícone decorativo (brasão de futebol genérico com \"HOD\") — ilustração própria inspirada na\n// ideia de escudo de clube, sem uso de marcas, cores oficiais ou brasões de terceiros.\nconst ICONE_BRASAO = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <defs>\n    <path id=\"curvaBrasaoTopo\" d=\"M 5 15 A 17 17 0 0 1 39 15\"/>\n  <\/defs>\n  <path d=\"M 22 2.5 L 37 7.5 L 37 20 C 37 30.5 30.5 38.5 22 41.5 C 13.5 38.5 7 30.5 7 20 L 7 7.5 Z\"\n        fill=\"#3E5C37\" stroke=\"#1C2419\" stroke-width=\"1.3\"/>\n  <path d=\"M 22 6 L 33.3 9.7 L 33.3 20 C 33.3 28.8 28.2 35.3 22 37.9 C 15.8 35.3 10.7 28.8 10.7 20 L 10.7 9.7 Z\"\n        fill=\"#4F7345\"/>\n  <path d=\"M 22 6 L 33.3 9.7 L 33.3 20 C 33.3 28.8 28.2 35.3 22 37.9 Z\" fill=\"#446A3C\" opacity=\"0.55\"/>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"6.4\" fill=\"#F5F6F2\" letter-spacing=\"1.6\">\n    <textPath href=\"#curvaBrasaoTopo\" startOffset=\"50%\" text-anchor=\"middle\">GALÁTICOS<\/textPath>\n  <\/text>\n  <path d=\"M 22 12 L 24.1 17.6 L 30 17.9 L 25.4 21.6 L 27 27.3 L 22 24 L 17 27.3 L 18.6 21.6 L 14 17.9 L 19.9 17.6 Z\"\n        fill=\"#D9A441\" stroke=\"#B4794A\" stroke-width=\"0.4\" opacity=\"0.9\"/>\n  <text x=\"22\" y=\"26.5\" font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"8.5\" fill=\"#F5F6F2\" text-anchor=\"middle\" stroke=\"#1C2419\" stroke-width=\"0.35\">HOD<\/text>\n<\/svg>`;\n\n// Ícone decorativo (emblema circular \"4\") — ilustração própria inspirada na ideia de \"time dos quatro\",\n// sem uso de marcas, nomes ou tipografia de terceiros.\nconst ICONE_BADGE4 = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <defs>\n    <path id=\"curvaTopo\" d=\"M 6 22 A 16 16 0 0 1 38 22\"/>\n    <path id=\"curvaBase\" d=\"M 8 26 A 14 14 0 0 0 36 26\"/>\n  <\/defs>\n  <circle cx=\"22\" cy=\"22\" r=\"21\" fill=\"#F4EEDD\" stroke=\"#C9BF9E\" stroke-width=\"1.2\"/>\n  <circle cx=\"22\" cy=\"22\" r=\"16.5\" fill=\"#1C63B7\" stroke=\"#0E3E7A\" stroke-width=\"1.4\"/>\n  <circle cx=\"22\" cy=\"22\" r=\"13.6\" fill=\"none\" stroke=\"#F4EEDD\" stroke-width=\"1\"/>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"7.8\" fill=\"#F4EEDD\" letter-spacing=\"1.4\">\n    <textPath href=\"#curvaTopo\" startOffset=\"50%\" text-anchor=\"middle\">LEADS<\/textPath>\n  <\/text>\n  <text font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"6.6\" fill=\"#F4EEDD\" letter-spacing=\"1.2\">\n    <textPath href=\"#curvaBase\" startOffset=\"50%\" text-anchor=\"middle\">TIME 1<\/textPath>\n  <\/text>\n  <text x=\"22\" y=\"27.5\" font-family=\"'Bricolage Grotesque',sans-serif\" font-weight=\"800\" font-size=\"17\" fill=\"#F4EEDD\" text-anchor=\"middle\">4<\/text>\n<\/svg>`;\n\n// Ícone decorativo (fadinha genérica) — ilustração própria, sem referência a marcas registradas.\nconst ICONE_FADA = `<svg class=\"fairy-icon\" viewBox=\"0 0 44 44\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n  <g transform=\"translate(22,23)\">\n    <path d=\"M -1 -3 C -13 -14 -20 -6 -14 2 C -9 8 -3 3 -1 -3 Z\" fill=\"#E85FA8\" stroke=\"#B23A80\" stroke-width=\"0.8\"/>\n    <path d=\"M 1 -3 C 13 -14 20 -6 14 2 C 9 8 3 3 1 -3 Z\" fill=\"#3E9CDC\" stroke=\"#2670A6\" stroke-width=\"0.8\"/>\n    <path d=\"M -1 3 C -9 12 -14 8 -10 3 C -7 -1 -3 0 -1 3 Z\" fill=\"#E85FA8\" stroke=\"#B23A80\" stroke-width=\"0.6\" opacity=\"0.95\"/>\n    <path d=\"M 1 3 C 9 12 14 8 10 3 C 7 -1 3 0 1 3 Z\" fill=\"#3E9CDC\" stroke=\"#2670A6\" stroke-width=\"0.6\" opacity=\"0.95\"/>\n    <circle cx=\"0\" cy=\"1\" r=\"4.6\" fill=\"#FFDDA8\" stroke=\"#B8791E\" stroke-width=\"0.6\"/>\n    <circle cx=\"-1.6\" cy=\"-0.4\" r=\"1\" fill=\"#2B1A0A\"/>\n    <circle cx=\"1.6\" cy=\"-0.4\" r=\"1\" fill=\"#2B1A0A\"/>\n    <path d=\"M -1.4 2.4 Q 0 3.8 1.4 2.4\" stroke=\"#B8492C\" stroke-width=\"0.9\" fill=\"none\" stroke-linecap=\"round\"/>\n    <path d=\"M 0 -3.6 Q -2.2 -6.6 -0.6 -8.2 Q 1 -6.6 0 -3.6 Z\" fill=\"#1FA85C\" stroke=\"#0F7A3F\" stroke-width=\"0.6\"/>\n    <path d=\"M 8 -10.5 L 9 -8.5 L 11 -8 L 9 -7.2 L 8 -5.2 L 7 -7.2 L 5 -8 L 7 -8.5 Z\" fill=\"#FFC72C\"/>\n    <path d=\"M -10 -7.4 L -9.4 -6.2 L -8.2 -5.8 L -9.4 -5.3 L -10 -4.1 L -10.5 -5.3 L -11.8 -5.8 L -10.5 -6.2 Z\" fill=\"#FFC72C\"/>\n    <circle cx=\"10.5\" cy=\"4\" r=\"0.9\" fill=\"#FFC72C\"/>\n  <\/g>\n<\/svg>`;\n\n// ── Desempenho por Time (Closers: A/B · SDRs: 1/2) ──\n// Meta de cada time = metade da meta do período selecionado (mesma lógica da meta geral,\n// que já soma os meses marcados no filtro). Sprinters NÃO passa por aqui — tem seção própria.\nfunction renderTimeCard(container, timeKey, timeInfo, mapaDiario, metaTime, pessoas){\n  const membros = timeInfo.membros;\n  const iconeHtml = timeInfo.icone==='badge4' ? ICONE_BADGE4 : (timeInfo.icone==='fada' ? ICONE_FADA : (timeInfo.icone==='brasao' ? ICONE_BRASAO : ''));\n  const div = document.createElement('div');\n  div.className = 'team-card';\n\n  const total = totalEquipe(membros, mapaDiario);\n  const pct = metaTime>0 ? (total/metaTime*100) : 0;\n  const falta = metaTime - total;\n\n  const linhaMembros = membros\n    .map(chave => {\n      const info = pessoas[chave];\n      const v = totalPessoa(chave, mapaDiario);\n      return { info, v };\n    })\n    .sort((a,b)=>b.v-a.v)\n    .map(({info,v}) => `<div class=\"team-card-membro\">\n        <span class=\"m-nome\">${info.apelido}${info.lider?' <span class=\"lider-tag\">★ líder<\/span>':''}${info.categoria ? ` <span class=\"cat-badge ${info.categoria}\">${CATEGORIA_LABEL[info.categoria]}<\/span>` : ''}<\/span>\n        <span class=\"m-valor\">${fmtMoeda(v)}<\/span>\n      <\/div>`).join('');\n\n  div.innerHTML = `\n    <div class=\"team-card-header\">\n      <span class=\"team-card-nome\">${iconeHtml}${timeInfo.nome} <span class=\"time-badge ${timeInfo.badge}\">${timeInfo.sigla}<\/span><\/span>\n    <\/div>\n    <div class=\"team-card-nums\">\n      <span class=\"team-card-total\">${fmtMoeda(total)}<\/span>\n      <span class=\"team-card-meta\">de ${fmtMoeda(metaTime)}<\/span>\n    <\/div>\n    <div class=\"team-card-trilho\"><div class=\"team-card-barra\" style=\"width:${Math.min(pct,100).toFixed(1)}%;${pct>=100?'background:var(--verde-2)':''}\"><\/div><\/div>\n    <div class=\"team-card-pct\">${pct.toFixed(1)}% da meta ${falta>0.01 ? '· faltam '+fmtMoeda(falta) : '· superada em '+fmtMoeda(-falta)}<\/div>\n    <div class=\"team-card-membros\">${linhaMembros}<\/div>\n  `;\n  container.appendChild(div);\n}\n\nfunction renderTimes(){\n  const meta = metaPeriodo();\n  const metaTime = meta / 2;\n  $('timesSub').textContent = `meta de cada time = metade da meta do período selecionado (${fmtMoeda(metaTime)})`;\n  const estrutura = estruturaAtual();\n\n  const contCloser = $('gTimesCloser'); contCloser.innerHTML = '';\n  Object.entries(estrutura.timesCloser).forEach(([k,info]) => renderTimeCard(contCloser, k, info, DADOS.diarioCloser, metaTime, estrutura.pessoasCloser));\n\n  const contSdr = $('gTimesSdr'); contSdr.innerHTML = '';\n  Object.entries(estrutura.timesSdr).forEach(([k,info]) => renderTimeCard(contSdr, k, info, DADOS.diarioSDR, metaTime, estrutura.pessoasSdr));\n}\n\n// ── Sprinters: NÃO é um time de vendas, é uma categoria de trabalho (por isso fica fora de\n// \"Desempenho por Time\", com visual próprio). Hoje rastreada pelo no-show de reuniões;\n// as vendas de quem está aqui continuam contando no Ranking de SDRs e no total geral. ──\n// ── ROAS de mídia, diarizado (DADOS.investimentoMidia[idxMes][dia] = valor investido;\n// vendas do dia reaproveitadas de DADOS.diarioTotal) ──\nfunction roasDiasFiltrado(){\n  const linhas = [];\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.investimentoMidia||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        const investimento = dias[diaStr];\n        const vendas = ((DADOS.diarioTotal||[])[idx]||{})[diaStr] || 0;\n        linhas.push({ idx, dia, investimento, vendas });\n      }\n    }\n  });\n  linhas.sort((a,b)=> a.idx-b.idx || a.dia-b.dia);\n  return linhas;\n}\n\n// ── Contatos GHL, diarizado (DADOS.ghlContatos[idxMes][dia] = {contatos, pipeline}) ──\nfunction ghlDiasFiltrado(){\n  const linhas = [];\n  st.meses.forEach(idx=>{\n    const dias = (DADOS.ghlContatos||[])[idx] || {};\n    for(const diaStr in dias){\n      const dia = +diaStr;\n      if(dia>=st.diaIni && dia<=st.diaFim){\n        const { contatos, pipeline } = dias[diaStr];\n        linhas.push({ idx, dia, contatos, pipeline });\n      }\n    }\n  });\n  linhas.sort((a,b)=> a.idx-b.idx || a.dia-b.dia);\n  return linhas;\n}\n\nfunction renderSprinters(){\n  const estrutura = estruturaAtual();\n  const secao = $('secSprinters');\n  const linhas = sprintersDiasFiltrado();\n  if(!estrutura.sprinters || !linhas.length){ secao.style.display = 'none'; return; }\n  secao.style.display = '';\n\n  const { membros } = estrutura.sprinters;\n  const nomes = membros.map(chave => estrutura.pessoasSdr[chave].apelido).join(' e ');\n  $('sprintersNomes').textContent = nomes;\n\n  // Média do período = agregado (soma de todos os dias), não média simples dos % diários —\n  // assim um dia com poucas reuniões não pesa igual a um dia cheio.\n  const agendadas = linhas.reduce((s,l)=>s+l.ag,0);\n  const aconteceram = linhas.reduce((s,l)=>s+l.ac,0);\n  const pctComp = agendadas>0 ? (aconteceram/agendadas*100) : 0;\n  const pctNoShow = 100 - pctComp;\n  $('sprintersAgendadas').textContent = agendadas;\n  $('sprintersAconteceram').textContent = aconteceram;\n  $('sprintersPctNoShow').textContent = pctNoShow.toFixed(1) + '%';\n  $('sprintersPctNoShow').style.color = '#B05C4A';\n  $('sprintersPctComp').textContent = pctComp.toFixed(1) + '% de comparecimento';\n  const rotuloPeriodo = linhas.length>1 ? `média de ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)} a ${sprintersLabelDia(linhas[linhas.length-1].idx,linhas[linhas.length-1].dia)}` : `dia ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)}`;\n  $('sprintersPeriodoLabel').textContent = rotuloPeriodo;\n  $('sprintersBarra').style.width = Math.min(pctComp,100).toFixed(1) + '%';\n\n  // Médias por dia (sobre todos os dias do período, incluindo dias sem reunião agendada)\n  const nDias = linhas.length;\n  $('sprintersMediaAgendadas').innerHTML = `<strong>${(agendadas/nDias).toFixed(1)}<\/strong> agendadas/dia`;\n  $('sprintersMediaAconteceram').innerHTML = `<strong>${(aconteceram/nDias).toFixed(1)}<\/strong> realizadas/dia`;\n\n  // Melhor/pior dia (usado só para destacar as linhas na tabela diária) — só entre dias com\n  // reunião agendada (ag>0), senão um dia \"zerado\" ganharia como melhor dia por padrão.\n  const comDados = linhas.filter(l=>l.ag>0).map(l=>({ ...l, pctNoShow: (l.ag-l.ac)/l.ag*100 }));\n\n  // Tabela diária (Dia / Agendadas / Realizadas / No-show), mais recente primeiro, com escala\n  // de cor sobre o % de no-show relativa ao próprio período exibido.\n  const melhorDia = comDados.length ? comDados.reduce((a,b)=> b.pctNoShow<a.pctNoShow ? b : a) : null;\n  const piorDia = comDados.length ? comDados.reduce((a,b)=> b.pctNoShow>a.pctNoShow ? b : a) : null;\n  const minPct = comDados.length ? Math.min(...comDados.map(l=>l.pctNoShow)) : 0;\n  const maxPct = comDados.length ? Math.max(...comDados.map(l=>l.pctNoShow)) : 0;\n  const contDias = $('sprintersDias');\n  contDias.innerHTML = `<div class=\"metrica-table-head\"><span>Dia<\/span><span>Agendadas<\/span><span>Realizadas<\/span><span>No-show<\/span><\/div>`;\n  linhas.forEach(l=>{ // ordem cronológica (mais antigo primeiro)\n    const semReuniao = l.ag===0;\n    const pct = semReuniao ? null : (l.ag-l.ac)/l.ag*100;\n    const ehMelhor = melhorDia && l.idx===melhorDia.idx && l.dia===melhorDia.dia;\n    const ehPior = piorDia && l.idx===piorDia.idx && l.dia===piorDia.dia;\n    const row = document.createElement('div');\n    row.className = 'metrica-table-row' + (semReuniao ? ' sem-reuniao' : '');\n    const pillHtml = semReuniao\n      ? `<span class=\"metrica-pill\" style=\"background:var(--mdf);color:var(--tinta-2)\">–<\/span>`\n      : (()=>{ const {bg,fg} = escalaCor(pct, minPct, maxPct, false); return `<span class=\"metrica-pill\" style=\"background:${bg};color:${fg}\">${pct.toFixed(1)}%<\/span>`; })();\n    row.innerHTML = `\n      <span class=\"dia-nome\">${sprintersLabelDia(l.idx,l.dia)} <span class=\"metrica-dia-semana\">(${sprintersDiaSemana(l.idx,l.dia)})<\/span>${ehMelhor?' <span class=\"destaque-tag melhor\">melhor<\/span>':''}${ehPior?' <span class=\"destaque-tag pior\">pior<\/span>':''}<\/span>\n      <span>${semReuniao ? '–' : l.ag}<\/span>\n      <span>${semReuniao ? '–' : l.ac}<\/span>\n      ${pillHtml}\n    `;\n    contDias.appendChild(row);\n  });\n}\n\n// ── Toggle \"ver no-show por dia\" — tabela diária vem minimizada por padrão ──\n$('sprintersToggle').addEventListener('click', () => {\n  const tabela = $('sprintersDias');\n  const botao = $('sprintersToggle');\n  const expandido = tabela.style.display !== 'none';\n  tabela.style.display = expandido ? 'none' : '';\n  botao.setAttribute('aria-expanded', String(!expandido));\n  $('sprintersToggleLabel').textContent = expandido ? 'Ver no-show por dia' : 'Minimizar no-show por dia';\n  $('sprintersToggleSeta').textContent = expandido ? '▸' : '▾';\n});\n\n// ── ROAS de Mídia: investimento diário vs. vendas do dia, com ROAS do período em destaque\n// e a tabela diarizada minimizada por padrão (mesmo padrão dos Sprinters) ──\nfunction renderRoas(){\n  const secao = $('secRoas');\n  const linhas = roasDiasFiltrado();\n  if(!linhas.length){ secao.style.display = 'none'; return; }\n  secao.style.display = '';\n\n  const investimento = linhas.reduce((s,l)=>s+l.investimento,0);\n  const vendas = linhas.reduce((s,l)=>s+l.vendas,0);\n  const roas = investimento>0 ? vendas/investimento : 0;\n  $('roasValor').textContent = roas.toFixed(1) + 'x';\n  $('roasInvestimento').innerHTML = `<span class=\"n-valor\">${fmtMoeda(investimento)}<\/span><span class=\"n-rotulo\">investido<\/span>`;\n  $('roasVendas').innerHTML = `<span class=\"n-valor\">${fmtMoeda(vendas)}<\/span><span class=\"n-rotulo\">em vendas no período<\/span>`;\n  const rotuloPeriodo = linhas.length>1 ? `período de ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)} a ${sprintersLabelDia(linhas[linhas.length-1].idx,linhas[linhas.length-1].dia)}` : `dia ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)}`;\n  $('roasPeriodoLabel').textContent = rotuloPeriodo;\n\n  const comRoas = linhas.map(l=>({ ...l, roas: l.investimento>0 ? l.vendas/l.investimento : 0 }));\n  const minRoas = Math.min(...comRoas.map(l=>l.roas));\n  const maxRoas = Math.max(...comRoas.map(l=>l.roas));\n  const contDias = $('roasDias');\n  contDias.innerHTML = `<div class=\"metrica-table-head\"><span>Dia<\/span><span>Investido<\/span><span>Vendas<\/span><span>ROAS<\/span><\/div>`;\n  comRoas.forEach(l=>{\n    const row = document.createElement('div');\n    row.className = 'metrica-table-row';\n    const { bg, fg } = escalaCor(l.roas, minRoas, maxRoas, true);\n    row.innerHTML = `\n      <span class=\"dia-nome\">${sprintersLabelDia(l.idx,l.dia)} <span class=\"metrica-dia-semana\">(${sprintersDiaSemana(l.idx,l.dia)})<\/span><\/span>\n      <span>${fmtMoeda(l.investimento)}<\/span>\n      <span>${fmtMoeda(l.vendas)}<\/span>\n      <span class=\"metrica-pill\" style=\"background:${bg};color:${fg}\">${l.roas.toFixed(1)}x<\/span>\n    `;\n    contDias.appendChild(row);\n  });\n}\n$('roasToggle').addEventListener('click', () => {\n  const tabela = $('roasDias');\n  const botao = $('roasToggle');\n  const expandido = tabela.style.display !== 'none';\n  tabela.style.display = expandido ? 'none' : '';\n  botao.setAttribute('aria-expanded', String(!expandido));\n  $('roasToggleLabel').textContent = expandido ? 'Ver ROAS por dia' : 'Minimizar ROAS por dia';\n  $('roasToggleSeta').textContent = expandido ? '▸' : '▾';\n});\n\n// ── Contatos GHL: novos contatos no CRM vs. quantos entraram no pipeline, com a taxa de\n// conversão do período em destaque e a tabela diarizada minimizada por padrão ──\nfunction renderGhl(){\n  const secao = $('secGhl');\n  const linhas = ghlDiasFiltrado();\n  if(!linhas.length){ secao.style.display = 'none'; return; }\n  secao.style.display = '';\n\n  const contatos = linhas.reduce((s,l)=>s+l.contatos,0);\n  const pipeline = linhas.reduce((s,l)=>s+l.pipeline,0);\n  const conversao = contatos>0 ? pipeline/contatos*100 : 0;\n  $('ghlConversao').textContent = conversao.toFixed(1) + '%';\n  $('ghlContatosNum').innerHTML = `<span class=\"n-valor\">${contatos}<\/span><span class=\"n-rotulo\">contatos novos<\/span>`;\n  $('ghlPipelineNum').innerHTML = `<span class=\"n-valor\">${pipeline}<\/span><span class=\"n-rotulo\">adicionados ao pipeline<\/span>`;\n  const rotuloPeriodo = linhas.length>1 ? `período de ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)} a ${sprintersLabelDia(linhas[linhas.length-1].idx,linhas[linhas.length-1].dia)}` : `dia ${sprintersLabelDia(linhas[0].idx,linhas[0].dia)}`;\n  $('ghlPeriodoLabel').textContent = rotuloPeriodo;\n\n  const comConversao = linhas.map(l=>({ ...l, pct: l.contatos>0 ? l.pipeline/l.contatos*100 : 0 }));\n  const minPct = Math.min(...comConversao.map(l=>l.pct));\n  const maxPct = Math.max(...comConversao.map(l=>l.pct));\n  const contDias = $('ghlDias');\n  contDias.innerHTML = `<div class=\"metrica-table-head\"><span>Dia<\/span><span>Contatos<\/span><span>Pipeline<\/span><span>Conversão<\/span><\/div>`;\n  comConversao.forEach(l=>{\n    const row = document.createElement('div');\n    row.className = 'metrica-table-row';\n    const { bg, fg } = escalaCor(l.pct, minPct, maxPct, true);\n    row.innerHTML = `\n      <span class=\"dia-nome\">${sprintersLabelDia(l.idx,l.dia)} <span class=\"metrica-dia-semana\">(${sprintersDiaSemana(l.idx,l.dia)})<\/span><\/span>\n      <span>${l.contatos}<\/span>\n      <span>${l.pipeline}<\/span>\n      <span class=\"metrica-pill\" style=\"background:${bg};color:${fg}\">${l.pct.toFixed(1)}%<\/span>\n    `;\n    contDias.appendChild(row);\n  });\n}\n$('ghlToggle').addEventListener('click', () => {\n  const tabela = $('ghlDias');\n  const botao = $('ghlToggle');\n  const expandido = tabela.style.display !== 'none';\n  tabela.style.display = expandido ? 'none' : '';\n  botao.setAttribute('aria-expanded', String(!expandido));\n  $('ghlToggleLabel').textContent = expandido ? 'Ver conversão por dia' : 'Minimizar conversão por dia';\n  $('ghlToggleSeta').textContent = expandido ? '▸' : '▾';\n});\n\n// ── Atingimento individual (meta mensal por categoria × nº de meses selecionados) ──\nfunction renderIndividualBloco(container, pessoas, mapaDiario, timesCloser, timesSdr){\n  container.innerHTML = '';\n  const nMeses = Math.max(st.meses.size, 1);\n\n  CATEGORIA_ORDEM.forEach(cat => {\n    const doCat = Object.entries(pessoas).filter(([,info]) => info.categoria === cat);\n    if(!doCat.length) return;\n\n    const heading = document.createElement('div');\n    heading.className = 'categoria-heading';\n    heading.innerHTML = `<span class=\"legenda-dot ${cat}\"><\/span>${CATEGORIA_LABEL[cat]} — meta ${fmtMoeda(doCat[0][1].meta)}/mês`;\n    container.appendChild(heading);\n\n    const lista = document.createElement('div');\n    lista.className = 'individual-list';\n\n    doCat\n      .map(([chave, info]) => ({ chave, info, valor: totalPessoa(chave, mapaDiario) }))\n      .sort((a,b)=>b.valor-a.valor)\n      .forEach(({chave, info, valor}) => {\n        const metaIndiv = info.meta * nMeses;\n        const pct = metaIndiv>0 ? (valor/metaIndiv*100) : 0;\n        const bateu = pct >= 100;\n        const row = document.createElement('div');\n        row.className = 'individual-row';\n        row.innerHTML = `\n          <div class=\"individual-row-topo\">\n            <span class=\"individual-nome\">${info.apelido}${info.lider?' <span class=\"lider-tag\">★<\/span>':''}${(() => { const t = info.time && (timesCloser[info.time]||timesSdr[info.time]); return t ? ` <span class=\"time-badge ${t.badge}\">${t.sigla}<\/span>` : ''; })()}<\/span>\n            <span class=\"individual-num\"><strong>${fmtMoeda(valor)}<\/strong> / ${fmtMoeda(metaIndiv)} · ${pct.toFixed(1)}%<\/span>\n          <\/div>\n          <div class=\"individual-bar-trilho\"><div class=\"individual-bar ${bateu?'bateu':cat}\" style=\"width:${Math.min(pct,100).toFixed(1)}%\"><\/div><\/div>\n        `;\n        lista.appendChild(row);\n      });\n\n    container.appendChild(lista);\n  });\n}\n\nfunction renderIndividual(){\n  const nMeses = Math.max(st.meses.size, 1);\n  $('individualSub').textContent = `meta mensal por categoria × ${nMeses} mês${nMeses>1?'es':''} selecionado${nMeses>1?'s':''}`;\n  const estrutura = estruturaAtual();\n  renderIndividualBloco($('gIndividualCloser'), estrutura.pessoasCloser, DADOS.diarioCloser, estrutura.timesCloser, estrutura.timesSdr);\n  renderIndividualBloco($('gIndividualSdr'), estrutura.pessoasSdr, DADOS.diarioSDR, estrutura.timesCloser, estrutura.timesSdr);\n}\n\n// ── Busca por nome dentro de um ranking (filtra sem recalcular posição) ──\nfunction ligaBusca(inputId, limparId, elId, infoId){\n  const input = $(inputId), botaoLimpar = $(limparId), el = $(elId), info = $(infoId);\n  let totalPessoas = 0;\n  function aplica(){\n    const termo = normaliza(input.value.trim());\n    botaoLimpar.classList.toggle('visivel', termo.length>0);\n    let visiveis = 0;\n    el.querySelectorAll('.slat-row').forEach(row=>{\n      const bate = !termo || row.dataset.nome.includes(termo);\n      row.style.display = bate ? '' : 'none';\n      if(bate) visiveis++;\n    });\n    info.textContent = termo ? `Mostrando ${visiveis} de ${totalPessoas}` : '';\n  }\n  input.addEventListener('input', aplica);\n  botaoLimpar.addEventListener('click', ()=>{ input.value=''; aplica(); input.focus(); });\n  return { aplica, setTotal(n){ totalPessoas = n; } };\n}\nconst buscaCloser = ligaBusca('buscaCloser','limpaBuscaCloser','gCloser','infoCloser');\nconst buscaSdr = ligaBusca('buscaSdr','limpaBuscaSdr','gSdr','infoSdr');\n\n// ── Divergência Closer x SDR por mês, dentro do recorte de dias atual ──\nfunction calcDivergencias(){\n  const divergentes = [];\n  [...st.meses].sort().forEach(i=>{\n    const totC = DADOS.closers.reduce((s,n)=>{\n      const dias = (DADOS.diarioCloser[n]||[])[i] || {};\n      let sub=0;\n      for(const d in dias){ if(+d>=st.diaIni && +d<=st.diaFim) sub+=dias[d]; }\n      return s+sub;\n    },0);\n    const totS = DADOS.sdrs.reduce((s,n)=>{\n      const dias = (DADOS.diarioSDR[n]||[])[i] || {};\n      let sub=0;\n      for(const d in dias){ if(+d>=st.diaIni && +d<=st.diaFim) sub+=dias[d]; }\n      return s+sub;\n    },0);\n    const diff = totC - totS;\n    if(Math.abs(diff) > 0.01) divergentes.push({ mes: DADOS.meses[i], totC, totS, diff });\n  });\n  return divergentes;\n}\n\n// ── Render geral ──\nfunction render(){\n  const nMeses = st.meses.size;\n  const filtroDiasTexto = (st.diaIni===1 && st.diaFim===31) ? '' : ` · dias ${st.diaIni}–${st.diaFim}`;\n  $('contagem').innerHTML = `<strong>${nMeses}<\/strong> mês${nMeses>1?'es':''} selecionado${nMeses>1?'s':''} · ${[...st.meses].sort().map(i=>DADOS.meses[i]).join(', ')}${filtroDiasTexto}`;\n\n  const rankCloser = rankingEquipe(DADOS.closers, DADOS.diarioCloser).filter(([,v])=>v>0);\n  const rankSdr = rankingEquipe(DADOS.sdrs, DADOS.diarioSDR).filter(([,v])=>v>0);\n  const totCloser = rankCloser.reduce((s,[,v])=>s+v,0);\n  const lowTicket = totalLowTicketFiltrado();\n  const recDiego = totalRecDiegoFiltrado();\n  const totGeral = totCloser + lowTicket.valor + recDiego.valor;\n  const meta = metaPeriodo();\n  const falta = meta - totGeral;\n\n  $('kMeta').textContent = fmtMoeda(meta);\n  $('kMetaDet').textContent = falta > 0.01 ? `faltam ${fmtMoeda(falta)}` : `meta superada em ${fmtMoeda(-falta)}`;\n  $('kTotal').textContent = fmtMoeda(totGeral);\n  $('kTotalDet').textContent = (meta ? `${(totGeral/meta*100).toFixed(1)}% da meta` : '—') + filtroDiasTexto;\n\n  // ── Projeção de fechamento: com base no ritmo até o dia em questão, em qual valor\n  // fecharíamos o mês? Só faz sentido para um único mês em andamento (o corrente) —\n  // mês já fechado mostra o resultado final real; sem mês corrente no recorte, fica vazio. ──\n  {\n    const r = calcRitmo();\n    const elProj = $('kProjecao'), elProjDet = $('kProjecaoDet');\n    if(r && r.status==='corrente' && st.meses.size===1 && st
